<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SGV Pedidos">
<title>Distribuidora SGV</title>
<meta name="theme-color" content="#1565B8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#1565B8;--azul-osc:#0F4C8C;--rojo:#D8262F;--tinta:#14202E;--gris:#5B6B7D;--linea:#D9E0E8;--fondo:#F2F5F9;--blanco:#fff;--ok:#1E8E4E}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,sans-serif;background:var(--fondo);color:var(--tinta);font-size:16px}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.caja{background:var(--blanco);border-radius:10px;padding:28px;width:100%;max-width:400px;box-shadow:0 2px 14px rgba(20,32,46,.08);border-top:5px solid var(--rojo)}
.caja img.logo{display:block;width:170px;margin:0 auto 6px}
.caja h1{font-size:22px;text-align:center;margin:0 0 20px;font-weight:600}
label{display:block;font-weight:500;margin:14px 0 5px;font-size:15px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:6px;background:#fff;font-size:16px}
.btn{background:var(--azul);color:#fff;border:0;border-radius:6px;padding:12px 16px;font-weight:600;cursor:pointer;width:100%;margin-top:20px}
.btn:hover{background:var(--azul-osc)}
.btn.chico{width:auto;margin:0;padding:8px 14px;font-size:14px}
.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
.link{background:none;border:0;color:var(--azul);cursor:pointer;text-decoration:underline;padding:0;margin-top:16px;display:block;width:100%;text-align:center}
.msg{margin-top:14px;padding:10px 12px;border-radius:6px;font-size:15px}
.msg.err{background:#FDECEC;color:#9B1C22}.msg.ok{background:#E7F5ED;color:#17653A}
header{background:var(--blanco);border-bottom:4px solid var(--azul);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
header img{height:42px}
header .quien{margin-left:auto;text-align:right;font-size:14px;line-height:1.25}
header .quien b{display:block;font-size:15px}
nav{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto}
nav button{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--gris);cursor:pointer;white-space:nowrap}
nav button.activa{color:var(--azul);border-color:var(--rojo)}
main{padding:20px;max-width:1300px;margin:0 auto}
.panel{background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 14px rgba(20,32,46,.06)}
.panel h2{margin:0 0 12px;font-size:19px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--linea)}
.fila:first-of-type{border-top:0}
.fila .dato{flex:1;min-width:160px}
.fila .dato small{display:block;color:var(--gris)}
.fila select{width:auto;min-width:130px}
.etiqueta{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;background:#E4ECF6;color:var(--azul-osc)}
.etiqueta.pendiente{background:#FFF1D6;color:#8A5A00}
.vacio{color:var(--gris);padding:10px 0}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.barra h2{margin:0}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px;align-items:end;margin-bottom:10px}
.filtros label{margin-top:10px}
button.item{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;color:inherit}
button.item:hover{background:#F2F5F9}
.etiqueta.listo{background:#DDF1E5;color:#17653A}.etiqueta.entregado{background:#DCE8F8;color:var(--azul-osc)}.etiqueta.anulado{background:#EEE;color:#666}
.item-form{display:flex;gap:8px;margin-top:8px}.item-form .prod{flex:1}.item-form .cant{width:90px}
.acciones{display:flex;gap:10px;flex-wrap:wrap}.acciones .btn{flex:1}.acciones .btn.chico{flex:none}
.btn.peligro{background:var(--rojo)}
.sup{margin-bottom:16px}
.enc{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--azul);padding-bottom:10px;margin-bottom:12px}
.logo-remito{height:54px}.num-remito{text-align:right}.num-remito b{display:block;font-size:24px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
.num{text-align:right;white-space:nowrap}.series{display:block;color:var(--gris);font-size:13px}
@media print{header,nav,.no-print{display:none!important}body{background:#fff}.panel{box-shadow:none;padding:0}main{padding:0}}
/* --- ESTILOS DASHBOARD DOS COLUMNAS VENTAS --- */
.dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.dash-title h2 { margin: 0; font-size: 24px; color: #101828; }
.dash-title p { margin: 4px 0 0; color: #667085; font-size: 14px; }
.stats-bar { display: flex; gap: 12px; flex-wrap: wrap; }
.stat-card { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-width: 120px; }
.stat-num { font-size: 18px; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
.stat-num.p { background: #FEF3F2; color: #B42318; }
.stat-num.l { background: #ECFDF3; color: #027A48; }
.stat-label { font-size: 12px; font-weight: 600; color: #344054; text-transform: uppercase; }
.sync-banner { background: #ECFDF3; border: 1px solid #A6F4C5; color: #027A48; padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.grid-dash { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
@media (max-width: 950px) { .grid-dash { grid-template-columns: 1fr; } }
.pills { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.pill-btn { background: #fff; border: 1px solid #EAECF0; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; color: #344054; cursor: pointer; }
.pill-btn.activa { background: #0F172A; color: #fff; border-color: #0F172A; }
.item-form-grid { display: grid; grid-template-columns: 1fr 80px 36px; gap: 8px; margin-top: 8px; align-items: center; }
.card-pedido { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(16,24,40,0.05); }
.card-pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.card-pedido-header h3 { margin: 0; font-size: 20px; color: #101828; display: flex; align-items: center; gap: 8px; font-weight: 700; }
.card-pedido-meta { display: flex; gap: 16px; font-size: 13px; color: #475467; margin-bottom: 14px; flex-wrap: wrap; }
.card-items-box { background: #F8FAFC; border: 1px solid #EAECF0; border-radius: 8px; padding: 10px 14px; }
.card-item-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #EAECF0; font-size: 14px; color: #334155; }
.card-item-row:last-child { border-bottom: 0; }
.badge-s-u { background: #E2E8F0; color: #475467; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-right: 6px; }
/* --- Ajustes dashboard: cliente protagonista, remito discreto --- */
.card-pedido-header{flex-wrap:wrap;gap:10px}
.card-pedido-header h3{font-size:22px;text-transform:uppercase;letter-spacing:.2px;flex-wrap:wrap;line-height:1.2}
.card-pedido-header h3 .etiqueta{text-transform:none;letter-spacing:0;font-size:12px}
.card-pedido-meta{margin-bottom:14px;margin-top:6px}
.remito-chico{color:#98A2B3;font-weight:500}
.acciones-card{display:flex;gap:8px;align-items:center}
.stat-num.e{background:#EFF4FF;color:#1849A9}
.nuevo-movil{display:none;margin:0 0 14px}
@media (max-width:950px){.col-form{display:none}.col-form.abierto{display:block}.nuevo-movil{display:block}}
.chip-serie{display:inline-block;background:#EEF2F6;border:1px solid #D9E0E8;border-radius:6px;padding:2px 8px;margin:4px 6px 0 0;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.lista-series{margin-top:4px}
.check-serie{display:inline-flex;align-items:center;gap:6px;margin:0 0 0 12px;font-weight:500;font-size:14px}
.check-serie input{width:auto}
.badge-cant{background:#F1F5F9;padding:2px 8px;border-radius:6px;font-weight:600;font-size:13px}
.enargas-box{margin-top:16px;padding:14px;border:2px solid var(--azul);border-radius:10px;background:#F2F7FD}
.serie-num{font-family:ui-monospace,Menlo,monospace;font-size:17px}
.fila.inactivo{opacity:.55}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const cfg = window.SGV_CONFIG;
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES = {admin:'Administrador', ventas:'Ventas', deposito:'Depósito', pendiente:'Sin asignar'};
let perfil = null, vista = null;
let filtros = {numero:'', cliente:'', estado:'', listo:'', entrega:''};
/* ---------- ENTRADA ---------- */
function pantallaLogin(modo='entrar', aviso=null){
  const nuevo = modo === 'crear';
  app.innerHTML = `
  <div class="centro"><div class="caja">
    <img class="logo" src="logo.png" alt="SGV">
    <h1>Bienvenido a Distribuidora SGV</h1>
    <form id="f">
      ${nuevo ? `<label for="nombre">Nombre</label><input id="nombre" required autocomplete="name">
      <label for="puesto">Puesto</label>
      <select id="puesto"><option value="ventas">Ventas</option><option value="deposito">Depósito</option></select>` : ''}
      <label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="email">
      <label for="pass">Contraseña</label><input id="pass" type="password" required minlength="6" autocomplete="${nuevo?'new-password':'current-password'}">
      <button class="btn" type="submit">${nuevo ? 'Crear usuario' : 'Entrar'}</button>
    </form>
    <div id="aviso">${aviso ? `<div class="msg ${aviso.tipo}">${esc(aviso.texto)}</div>` : ''}</div>
    <button class="link" id="cambiar">${nuevo ? 'Ya tengo usuario' : 'Crear usuario nuevo'}</button>
  </div></div>`;
  document.getElementById('cambiar').onclick = () => pantallaLogin(nuevo ? 'entrar' : 'crear');
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pass').value;
    let r;
    if(nuevo){
      r = await sb.auth.signUp({email, password, options:{data:{
        nombre: document.getElementById('nombre').value.trim(),
        puesto: document.getElementById('puesto').value}}});
      if(!r.error && !r.data.session) return pantallaLogin('entrar',{tipo:'ok',texto:'Usuario creado. Revisá tu correo para confirmar la cuenta y después entrá.'});
    } else {
      r = await sb.auth.signInWithPassword({email, password});
    }
    if(r.error) document.getElementById('aviso').innerHTML = `<div class="msg err">${esc(traducir(r.error.message))}</div>`;
  };
}
function traducir(m){
  if(/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/already registered/i.test(m)) return 'Ese correo ya tiene un usuario creado.';
  if(/Email not confirmed/i.test(m)) return 'Primero confirmá tu correo con el mensaje que te llegó.';
  return m;
}
/* ---------- SISTEMA ---------- */
async function cargarPerfil(){
  const {data:{user}} = await sb.auth.getUser();
  const {data,error} = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(error || !data){ await sb.auth.signOut(); return; }
  perfil = data;
  if(!perfil.activo || perfil.rol === 'pendiente') return pantallaEspera();
  armarSistema();
}
function cabecera(){
  return `<header>
    <img src="logo.png" alt="SGV">
    <div class="quien"><b>${esc(perfil.nombre)}</b>${ROLES[perfil.rol]}</div>
    <button class="btn sec chico" id="salir">Salir</button>
  </header>`;
}
function conectarSalir(){ document.getElementById('salir').onclick = () => sb.auth.signOut(); }
function pantallaEspera(){
  app.innerHTML = cabecera() + `<main><div class="panel">
    <h2>Tu usuario está esperando aprobación</h2>
    <p>Pedile al administrador que te asigne el puesto${perfil.activo ? '' : ' y active tu usuario'}. Cuando lo haga, volvé a entrar.</p>
    <button class="btn chico" id="reintentar">Ya me aprobaron, actualizar</button></div></main>`;
  conectarSalir();
  document.getElementById('reintentar').onclick = cargarPerfil;
}
function armarSistema(){
  const tabs = [];
  if(['ventas','admin'].includes(perfil.rol)) tabs.push(['ventas','Ventas'], ['productos','Productos']);
  if(['deposito','admin'].includes(perfil.rol)) tabs.push(['deposito','Depósito']);
  tabs.push(['series','N.º de serie']);
  if(perfil.rol === 'admin') tabs.push(['usuarios','Usuarios']);
  vista = vista && tabs.some(t=>t[0]===vista) ? vista : tabs[0][0];
  app.innerHTML = cabecera() +
    `<nav>${tabs.map(([k,n])=>`<button data-v="${k}" class="${k===vista?'activa':''}">${n}</button>`).join('')}</nav>
     <main id="contenido"></main>`;
  conectarSalir();
  app.querySelectorAll('nav button').forEach(b => b.onclick = () => { vista = b.dataset.v; armarSistema(); });
  ({ventas:vistaVentas, deposito:vistaDeposito, series:vistaSeries, productos:vistaProductos, usuarios:vistaUsuarios})[vista]();
}
/* ---------- DEPÓSITO ---------- */
let depTab = 'pendiente';
const DEP_TABS = [['pendiente','Para preparar'],['listo','Listos para entregar'],['entregado','Entregados']];

function vistaDeposito(){
  const c = document.getElementById('contenido');
  c.innerHTML = `<div class="panel">
    <div class="barra"><h2>Depósito</h2></div>
    <div class="pills">${DEP_TABS.map(([k,n])=>`<button class="pill-btn ${depTab===k?'activa':''}" data-t="${k}">${n}</button>`).join('')}</div>
    <div class="filtros">
      <div><label for="d-numero">N.º de remito</label><input id="d-numero" type="number" min="1" value="${esc(filtros.numero)}"></div>
      <div><label for="d-cliente">Cliente</label><input id="d-cliente" value="${esc(filtros.cliente)}"></div>
      <div><button class="btn sec chico" id="d-limpiar" style="margin-top:0">Limpiar filtros</button></div>
    </div>
    <div id="res-dep" class="vacio">Cargando…</div></div>`;
  let t;
  const buscar = () => { clearTimeout(t); t = setTimeout(cargarPedidosDeposito, 300); };
  document.getElementById('d-numero').oninput = e => { filtros.numero = e.target.value; buscar(); };
  document.getElementById('d-cliente').oninput = e => { filtros.cliente = e.target.value; buscar(); };
  document.getElementById('d-limpiar').onclick = () => { filtros.numero = ''; filtros.cliente = ''; vistaDeposito(); };
  c.querySelectorAll('.pill-btn').forEach(b => b.onclick = () => { depTab = b.dataset.t; vistaDeposito(); });
  suscribirPedidos();
  cargarPedidosDeposito();
}

async function cargarPedidosDeposito(){
  const res = document.getElementById('res-dep'); if(!res) return;
  let q = sb.from('pedidos').select('*, pedido_items(*, series(*))').eq('estado', depTab)
    .order('numero_remito',{ascending: depTab === 'pendiente'}).limit(100);
  const n = parseInt(filtros.numero,10);
  if(filtros.numero && !isNaN(n)) q = q.eq('numero_remito', n);
  if(filtros.cliente && filtros.cliente.trim()) q = q.ilike('cliente', `%${filtros.cliente.trim()}%`);
  const {data,error} = await q;
  if(error) return res.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  res.className = '';
  const vacio = {pendiente:'No hay pedidos para preparar en este momento.', listo:'No hay pedidos listos esperando entrega.', entregado:'Todavía no hay pedidos entregados.'}[depTab];
  res.innerHTML = data.length ? data.map(p => {
    const nSeries = p.pedido_items.reduce((a,i) => a + (i.series ? i.series.length : 0), 0);
    return `
    <button class="fila item item-deposito" data-id="${p.id}">
      <div class="dato"><b style="font-size:18px;text-transform:uppercase">${esc(p.cliente)}</b>
        <small>Remito ${fmtRemito(p.numero_remito)}${nSeries ? ` · ${nSeries} n.º de serie cargados` : ''}</small></div>
      <div class="dato"><span class="etiqueta ${p.estado}">${ESTADOS[p.estado]}</span>
        <small>${MODAL[p.modalidad]} · Entrega: ${fmtFecha(p.fecha_entrega)}</small></div>
    </button>`; }).join('') : `<p class="vacio">${vacio}</p>`;
  res.querySelectorAll('.item-deposito').forEach(b => b.onclick = () => detallePedidoDeposito(b.dataset.id));
}

async function detallePedidoDeposito(id, editando=false){
  const c = document.getElementById('contenido');
  c.innerHTML = '<div class="panel vacio">Cargando…</div>';
  await cargarProductos();
  const {data:p, error} = await sb.from('pedidos').select('*, pedido_items(*, series(*))').eq('id', id).single();
  if(error) return c.innerHTML = `<div class="panel"><div class="msg err">${esc(error.message)}</div></div>`;

  const items = p.pedido_items.sort((a,b)=>a.id-b.id);
  const abierto = ['pendiente','listo'].includes(p.estado);   // se puede tocar hasta que pasa a ENTREGADO
  editando = editando && abierto;
  const prep = i => Math.min(Number(i.cantidad_preparada || 0), Number(i.cantidad));
  const completo = i => prep(i) >= Number(i.cantidad);
  const req = i => i.series_requeridas ?? Math.ceil(i.cantidad);
  const faltaSerie = i => i.lleva_serie ? Math.max(0, req(i) - (i.series || []).length) : 0;

  const filas = editando
    ? `<tr><td><div style="display:grid;grid-template-columns:1fr 80px 36px;gap:8px;font-size:12px;font-weight:600;color:var(--gris)"><span>PRODUCTO</span><span>CANT.</span><span></span></div>
        <datalist id="lista-productos">${productosLista.map(x => `<option value="${esc(x.nombre)}">`).join('')}</datalist>
        <div id="ed-items">${items.map(i => `<div class="item-form-grid ed-row" data-item-id="${i.id}">
          <input class="prod" list="lista-productos" value="${esc(i.producto)}" aria-label="Producto" autocomplete="off">
          <input class="cant" type="number" step="any" min="0" value="${i.cantidad}" aria-label="Cantidad">
          <button type="button" class="quitar" aria-label="Quitar">✕</button></div>`).join('')}</div>
        <button type="button" class="btn sec chico" id="ed-mas" style="margin-top:10px;width:100%;border-style:dashed">+ Agregar producto</button></td></tr>`
    : items.map(i => {
      const ser = i.series || [], falta = faltaSerie(i);
      const chips = ser.length ? ser.map(s => `<span class="chip-serie">${esc(s.numero_serie)}${abierto ? `<button type="button" class="del-serie" data-id="${s.id}" title="Quitar" style="background:none;border:0;color:var(--rojo);cursor:pointer;padding:0 0 0 6px">✕</button>` : ''}</span>`).join('') : '<small class="series">Sin números de serie</small>';
      return `<tr><td>
        <b>${esc(i.producto)}</b> <span class="badge-cant">x${i.cantidad}</span>
        ${abierto ? `<label class="check-serie"><input type="checkbox" class="chk-lleva" data-item-id="${i.id}" ${i.lleva_serie ? 'checked' : ''}> Lleva n.º de serie</label>` : (i.lleva_serie ? '<span class="badge-s-u">S/U</span>' : '')}
        ${abierto ? `<div class="item-form" style="align-items:center;margin-top:6px">
          <label class="check-serie" style="margin:0"><input type="checkbox" class="chk-prep" data-item-id="${i.id}" ${completo(i) ? 'checked' : ''}> Preparado</label>
          <input type="number" class="inp-prep" data-item-id="${i.id}" step="any" min="0" max="${i.cantidad}" value="${prep(i)}" style="width:90px;padding:6px" aria-label="Cantidad preparada"> <small>de ${i.cantidad}</small></div>`
          : `<div><small class="series">Preparado: ${prep(i)} de ${i.cantidad}</small></div>`}
        ${abierto && i.lleva_serie ? `<div class="item-form" style="align-items:center;margin-top:6px">
          <label style="margin:0;font-size:14px">¿Cuántos n.º de serie cargar?</label>
          <input type="number" class="inp-req" data-item-id="${i.id}" min="0" step="1" value="${req(i)}" style="width:80px;padding:6px"></div>` : ''}
        <div class="lista-series">${chips}</div>
        ${abierto && falta > 0 ? `<div class="casillas" data-item-id="${i.id}">
          ${Array.from({length: falta}, (_,k) => `<input class="input-serie" data-item-id="${i.id}" placeholder="N.º de serie ${ser.length + k + 1} de ${req(i)}" style="font-size:14px;padding:8px;margin-top:6px">`).join('')}
          <button type="button" class="btn chico btn-add-serie" data-item-id="${i.id}" style="margin-top:8px">Guardar números de serie</button></div>` : ''}
      </td></tr>`;
    }).join('');

  const haySeries = items.some(i => i.series && i.series.length);
  let acciones = '<button class="btn sec chico" id="volver-dep">← Volver</button>';
  if(editando){
    acciones += '<button class="btn chico" id="ed-guardar" style="background:var(--ok)">Guardar cambios</button><button class="btn sec chico" id="ed-cancelar">Cancelar edición</button>';
  } else {
    if(abierto) acciones += '<button class="btn sec chico" id="editar">✏️ Editar pedido</button>';
    if(p.estado === 'pendiente') acciones += '<button class="btn chico" id="marcar-listo" style="background:var(--ok)">Marcar pedido como LISTO</button>';
    if(p.estado === 'listo') acciones += `<button class="btn chico" id="marcar-entregado" style="background:var(--ok)">${p.modalidad==='despacho' ? 'Marcar como DESPACHADO' : 'Marcar como ENTREGADO'}</button>`;
    if(p.estado === 'entregado' && haySeries && p.enargas_transferido !== true) acciones += '<button class="btn chico" id="marcar-enargas">Marcar series transferidas en ENARGAS</button>';
  }

  c.innerHTML = `<div class="panel remito">
    <div class="acciones sup">${acciones}</div>
    <div class="enc"><img src="logo.png" alt="SGV" class="logo-remito">
      <div class="num-remito">Remito<b>${fmtRemito(p.numero_remito)}</b></div></div>
    <p><b>Cliente:</b> <span style="font-size:18px;text-transform:uppercase;font-weight:700">${esc(p.cliente)}</span><br>
       <b>Estado:</b> <span class="etiqueta ${p.estado}">${ESTADOS[p.estado]}</span><br>
       <b>Modalidad:</b> ${MODAL[p.modalidad]}<br>
       <b>Fecha de entrega:</b> ${fmtFecha(p.fecha_entrega)}
       ${p.fecha_listo ? `<br><b>Listo:</b> ${fmtFechaHora(p.fecha_listo)}` : ''}
       ${p.fecha_entregado ? `<br><b>Entregado:</b> ${fmtFechaHora(p.fecha_entregado)}` : ''}
       ${p.comentarios ? `<br><b>Nota:</b> ${esc(p.comentarios)}` : ''}
       ${p.enargas_transferido !== null ? `<br><b>Series transferidas en ENARGAS:</b> ${p.enargas_transferido ? 'Sí' : 'No'}` : ''}</p>
    <table><thead><tr><th>${editando ? 'Editando productos del pedido' : 'Productos, preparación y números de serie'}</th></tr></thead><tbody>${filas}</tbody></table>
    <div id="aviso-dep"></div>
  </div>`;
  const aviso = document.getElementById('aviso-dep');
  const err = m => aviso.innerHTML = `<div class="msg err">${m}</div>`;
  document.getElementById('volver-dep').onclick = vistaDeposito;
  const itemPorId = x => items.find(i => String(i.id) === String(x));
  const actualizarItem = async (itemId, campos) => {
    const {error: e} = await sb.from('pedido_items').update(campos).eq('id', itemId);
    if(e) err(esc(e.message)); else detallePedidoDeposito(id);
  };

  /* ---- MODO EDICIÓN (hasta ENTREGADO) ---- */
  if(editando){
    const cont = document.getElementById('ed-items'), quitados = [];
    const nuevaFila = () => {
      const d = document.createElement('div'); d.className = 'item-form-grid ed-row';
      d.innerHTML = `<input class="prod" list="lista-productos" placeholder="Buscar producto de la lista" autocomplete="off">
        <input class="cant" type="number" step="any" min="0" value="1"><button type="button" class="quitar" aria-label="Quitar">✕</button>`;
      cont.appendChild(d); bindQuitar(d);
    };
    const bindQuitar = d => d.querySelector('.quitar').onclick = () => {
      if(cont.children.length <= 1) return;
      if(d.dataset.itemId) quitados.push(d.dataset.itemId);
      d.remove();
    };
    cont.querySelectorAll('.ed-row').forEach(bindQuitar);
    document.getElementById('ed-mas').onclick = nuevaFila;
    document.getElementById('ed-cancelar').onclick = () => detallePedidoDeposito(id);
    document.getElementById('ed-guardar').onclick = async () => {
      const buscar = t => productosLista.find(x => x.nombre.toUpperCase() === t.trim().toUpperCase());
      const rows = [...cont.children].map(d => ({id: d.dataset.itemId, texto: d.querySelector('.prod').value.trim(), cant: parseFloat(d.querySelector('.cant').value)}));
      const malos = rows.filter(r => !r.texto || !(r.cant > 0) || (!buscar(r.texto) && !(r.id && itemPorId(r.id).producto === r.texto)));
      if(malos.length) return err('Revisá los productos: cada uno tiene que estar en la lista y con cantidad mayor a 0.');
      const conSeries = quitados.map(itemPorId).filter(i => i.series && i.series.length);
      if(conSeries.length && !confirm('Vas a quitar productos que ya tienen números de serie cargados (' + conSeries.map(i => i.producto).join(', ') + '). Esas series se borran también. ¿Seguir?')) return;
      document.getElementById('ed-guardar').disabled = true;
      let fallo = null;
      for(const qid of quitados){
        let r = await sb.from('series').delete().eq('item_id', qid); fallo = fallo || r.error;
        r = await sb.from('pedido_items').delete().eq('id', qid); fallo = fallo || r.error;
      }
      for(const r of rows){
        const pr = buscar(r.texto);
        if(r.id){
          const o = itemPorId(r.id); const cambioProd = o.producto !== r.texto, cambioCant = Number(o.cantidad) !== r.cant;
          if(!cambioProd && !cambioCant) continue;
          const campos = {producto: pr ? pr.nombre : o.producto, cantidad: r.cant, cantidad_preparada: Math.min(prep(o), r.cant)};
          if(cambioProd && pr) campos.lleva_serie = pr.lleva_serie;
          if(cambioCant) campos.series_requeridas = null;
          const x = await sb.from('pedido_items').update(campos).eq('id', r.id); fallo = fallo || x.error;
        } else {
          const x = await sb.from('pedido_items').insert({pedido_id: p.id, producto: pr.nombre, cantidad: r.cant, lleva_serie: pr.lleva_serie}); fallo = fallo || x.error;
        }
      }
      await detallePedidoDeposito(id);
      if(fallo) document.getElementById('aviso-dep').innerHTML = `<div class="msg err">Algo no se pudo guardar: ${esc(fallo.message)}</div>`;
    };
    return;
  }

  /* ---- MODO PREPARACIÓN ---- */
  const bEditar = document.getElementById('editar'); if(bEditar) bEditar.onclick = () => detallePedidoDeposito(id, true);

  c.querySelectorAll('.chk-lleva').forEach(chk => chk.onchange = () => actualizarItem(chk.dataset.itemId, {lleva_serie: chk.checked}));
  c.querySelectorAll('.chk-prep').forEach(chk => chk.onchange = () =>
    actualizarItem(chk.dataset.itemId, {cantidad_preparada: chk.checked ? itemPorId(chk.dataset.itemId).cantidad : 0}));
  c.querySelectorAll('.inp-prep').forEach(inp => inp.onchange = () => {
    const max = Number(itemPorId(inp.dataset.itemId).cantidad);
    const v = Math.max(0, Math.min(max, parseFloat(inp.value) || 0));
    actualizarItem(inp.dataset.itemId, {cantidad_preparada: v});
  });
  c.querySelectorAll('.inp-req').forEach(inp => inp.onchange = () =>
    actualizarItem(inp.dataset.itemId, {series_requeridas: Math.max(0, parseInt(inp.value, 10) || 0)}));

  c.querySelectorAll('.del-serie').forEach(b => b.onclick = async () => {
    if(!confirm('¿Quitar este número de serie?')) return;
    const {error: e} = await sb.from('series').delete().eq('id', b.dataset.id);
    if(e) err(esc(e.message)); else detallePedidoDeposito(id);
  });

  c.querySelectorAll('.btn-add-serie').forEach(btn => btn.onclick = async () => {
    const itemId = btn.dataset.itemId;
    const vals = [...c.querySelectorAll(`.input-serie[data-item-id="${itemId}"]`)].map(x => x.value.trim()).filter(Boolean);
    if(!vals.length) return err('Ingresá al menos un número de serie.');
    if(new Set(vals).size !== vals.length) return err('Hay números de serie repetidos en las casillas.');
    btn.disabled = true;
    let msg = '';
    for(const numero_serie of vals){
      const {error: e} = await sb.from('series').insert({pedido_id: p.id, item_id: itemId, numero_serie, cargado_por: perfil.id});
      if(e){ msg = e.code === '23505' ? `El n.º de serie ${esc(numero_serie)} ya fue cargado en otro pedido o producto.` : 'Error al guardar: ' + esc(e.message); break; }
    }
    await detallePedidoDeposito(id);
    if(msg) document.getElementById('aviso-dep').innerHTML = `<div class="msg err">${msg}</div>`;
  });
  c.querySelectorAll('.casillas').forEach(box => {
    const ins = [...box.querySelectorAll('.input-serie')];
    ins.forEach((inp, k) => inp.onkeydown = e => {
      if(e.key !== 'Enter') return; e.preventDefault();
      if(ins[k+1]) ins[k+1].focus(); else box.querySelector('.btn-add-serie').click();
    });
  });
  setTimeout(() => { const f = c.querySelector('.input-serie'); if(f) f.focus(); }, 0);

  const cambiar = async campos => {
    const {error: e} = await sb.from('pedidos').update(campos).eq('id', p.id);
    if(e) err('No se pudo actualizar: ' + esc(e.message)); else vistaDeposito();
  };

  const listo = document.getElementById('marcar-listo');
  if(listo) listo.onclick = () => {
    const sinPrep = items.filter(i => !completo(i)), faltan = items.filter(i => faltaSerie(i) > 0);
    let m = '';
    if(sinPrep.length) m += 'Sin preparar completo: ' + sinPrep.map(i => i.producto).join(', ') + '.\n';
    if(faltan.length) m += 'Faltan números de serie de: ' + faltan.map(i => i.producto).join(', ') + '.\n';
    if(m && !confirm(m + '¿Marcar como listo igual?')) return;
    cambiar({estado:'listo'});
  };

  const entregar = document.getElementById('marcar-entregado');
  if(entregar) entregar.onclick = () => {
    if(!haySeries){
      if(confirm('¿Confirmás que el pedido fue ' + (p.modalidad==='despacho' ? 'despachado' : 'entregado') + '?')) cambiar({estado:'entregado'});
      return;
    }
    aviso.innerHTML = `<div class="enargas-box"><b>Este remito tiene números de serie.</b><br>¿Se transfirieron en el ENARGAS?
      <div class="acciones" style="margin-top:10px">
        <button class="btn chico" id="eng-si" style="background:var(--ok)">Sí, se transfirieron</button>
        <button class="btn chico sec" id="eng-no">No, todavía no</button>
        <button class="btn chico sec" id="eng-cancel">Cancelar</button></div></div>`;
    document.getElementById('eng-si').onclick = () => cambiar({estado:'entregado', enargas_transferido:true});
    document.getElementById('eng-no').onclick = () => cambiar({estado:'entregado', enargas_transferido:false});
    document.getElementById('eng-cancel').onclick = () => aviso.innerHTML = '';
  };

  const eng = document.getElementById('marcar-enargas');
  if(eng) eng.onclick = async () => {
    const {error: e} = await sb.from('pedidos').update({enargas_transferido:true}).eq('id', p.id);
    if(e) err(esc(e.message)); else detallePedidoDeposito(id);
  };
}

/* ---------- NÚMEROS DE SERIE (Ventas, Depósito y Admin) ---------- */
let busquedaSerie = '';
function vistaSeries(){
  const c = document.getElementById('contenido');
  c.innerHTML = `<div class="panel">
    <div class="barra"><h2>Números de serie</h2></div>
    <p class="vacio" style="padding-top:0">Todos los números de serie cargados, con el cliente y el remito al que salió cada uno.</p>
    <label for="b-serie">Buscar n.º de serie</label>
    <input id="b-serie" value="${esc(busquedaSerie)}" placeholder="Escribí o escaneá el número" autocomplete="off">
    <div id="res-series" class="vacio" style="margin-top:12px">Cargando…</div></div>`;
  let t;
  document.getElementById('b-serie').oninput = e => { busquedaSerie = e.target.value; clearTimeout(t); t = setTimeout(cargarSeries, 300); };
  cargarSeries();
}
async function cargarSeries(){
  const res = document.getElementById('res-series'); if(!res) return;
  let q = sb.from('series').select('id, numero_serie, creado_en, pedido_items(producto), pedidos(id, numero_remito, cliente, estado, fecha_entregado, enargas_transferido)')
    .order('creado_en',{ascending:false}).limit(200);
  if(busquedaSerie.trim()) q = q.ilike('numero_serie', `%${busquedaSerie.trim()}%`);
  const {data,error} = await q;
  if(error) return res.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  res.className = '';
  res.innerHTML = data.length ? data.map(s => `
    <button class="fila item item-serie" data-id="${s.pedidos.id}">
      <div class="dato"><b class="serie-num">${esc(s.numero_serie)}</b><small>${esc(s.pedido_items ? s.pedido_items.producto : '')}</small></div>
      <div class="dato"><b style="text-transform:uppercase">${esc(s.pedidos.cliente)}</b>
        <small>Remito ${fmtRemito(s.pedidos.numero_remito)} · ${s.pedidos.fecha_entregado ? 'Entregado ' + fmtFecha(s.pedidos.fecha_entregado) : ESTADOS[s.pedidos.estado]}</small></div>
    </button>`).join('') : '<p class="vacio">No se encontraron números de serie.</p>';
  res.querySelectorAll('.item-serie').forEach(b => b.onclick = () => detallePedido(b.dataset.id, vistaSeries));
}

/* ---------- PRODUCTOS (lista maestra) ---------- */
let productosLista = [], errorProductos = null;
async function cargarProductos(){
  const {data,error} = await sb.from('productos').select('*').eq('activo', true).order('nombre');
  errorProductos = error ? error.message : null;
  productosLista = data || [];
}

async function vistaProductos(){
  const c = document.getElementById('contenido');
  c.innerHTML = `<div class="panel">
    <div class="barra"><h2>Productos</h2></div>
    <p class="vacio" style="padding-top:0">Esta lista es la que se usa al crear pedidos, así el producto siempre sale escrito igual en el remito.</p>
    <form id="fprod" class="fila" style="border:0;padding-top:0;align-items:flex-end">
      <div class="dato"><label for="p-nombre" style="margin-top:0">Nuevo producto</label>
        <input id="p-nombre" placeholder="Ej: CNDUAL" required autocomplete="off"></div>
      <label class="check-serie" style="margin:0 0 10px"><input type="checkbox" id="p-serie"> Lleva n.º de serie</label>
      <button class="btn chico" type="submit" style="margin-bottom:6px">Agregar a la lista</button>
    </form>
    <div id="aviso-prod"></div>
    <label for="p-buscar">Buscar en la lista</label>
    <input id="p-buscar" placeholder="Escribí para filtrar" autocomplete="off">
    <div id="res-prod" class="vacio" style="margin-top:10px">Cargando…</div></div>`;
  document.getElementById('fprod').onsubmit = async e => {
    e.preventDefault();
    const aviso = document.getElementById('aviso-prod');
    const nombre = document.getElementById('p-nombre').value.trim().replace(/\s+/g,' ').toUpperCase();
    if(!nombre) return;
    const {error} = await sb.from('productos').insert({nombre, lleva_serie: document.getElementById('p-serie').checked});
    if(error) return aviso.innerHTML = `<div class="msg err">${error.code==='23505' ? 'Ese producto ya existe en la lista.' : esc(error.message)}</div>`;
    vistaProductos();
  };
  document.getElementById('p-buscar').oninput = () => listarProductos();
  listarProductos(true);
}

let todosProductos = [];
async function listarProductos(recargar){
  const res = document.getElementById('res-prod'); if(!res) return;
  if(recargar){
    const {data,error} = await sb.from('productos').select('*').order('activo',{ascending:false}).order('nombre');
    if(error) return res.innerHTML = `<div class="msg err">${esc(error.message)}<br>Si dice que la tabla no existe, falta correr el SQL de productos en Supabase.</div>`;
    todosProductos = data;
  }
  const f = (document.getElementById('p-buscar').value || '').trim().toUpperCase();
  const lista = todosProductos.filter(p => p.nombre.toUpperCase().includes(f));
  res.className = '';
  res.innerHTML = lista.length ? lista.map(p => `
    <div class="fila ${p.activo ? '' : 'inactivo'}">
      <div class="dato"><b>${esc(p.nombre)}</b> ${p.lleva_serie ? '<span class="badge-s-u">S/U</span>' : ''}${p.activo ? '' : ' <small>(desactivado)</small>'}</div>
      <label class="check-serie"><input type="checkbox" class="p-chk" data-id="${p.id}" ${p.lleva_serie ? 'checked' : ''}> Lleva serie</label>
      <button class="btn chico sec p-ren" data-id="${p.id}">Renombrar</button>
      <button class="btn chico sec p-act" data-id="${p.id}" data-activo="${p.activo}">${p.activo ? 'Desactivar' : 'Reactivar'}</button>
    </div>`).join('') : '<p class="vacio">No hay productos en la lista todavía.</p>';
  const actualizar = async (id, campos) => {
    const {error} = await sb.from('productos').update(campos).eq('id', id);
    if(error) alert(error.code==='23505' ? 'Ya existe un producto con ese nombre.' : 'No se pudo guardar: ' + error.message);
    listarProductos(true);
  };
  res.querySelectorAll('.p-chk').forEach(x => x.onchange = () => actualizar(x.dataset.id, {lleva_serie: x.checked}));
  res.querySelectorAll('.p-act').forEach(x => x.onclick = () => actualizar(x.dataset.id, {activo: x.dataset.activo !== 'true'}));
  res.querySelectorAll('.p-ren').forEach(x => x.onclick = () => {
    const actual = todosProductos.find(p => String(p.id) === x.dataset.id);
    const nuevo = prompt('Nuevo nombre del producto.\n(Los remitos ya hechos no cambian.)', actual.nombre);
    if(nuevo && nuevo.trim()) actualizar(x.dataset.id, {nombre: nuevo.trim().replace(/\s+/g,' ').toUpperCase()});
  });
}

        <div class="pills">
          ${[['todos','Todos'],['pendiente','Pendientes'],['listo','Listos'],['entregado','Entregados'],['anulado','Anulados']]
            .map(([k,n])=>`<button class="pill-btn ${filtroEstadoPill===k?'activa':''}" data-f="${k}">${n}</button>`).join('')}
        </div>
        <div id="res-ventas">Cargando pedidos…</div>
      </div>
    </div>`;

  const toggleForm = document.getElementById('toggle-form');
const colForm = document.getElementById('col-form');

if (toggleForm && colForm) {
  toggleForm.onclick = () => colForm.classList.toggle('abierto');
}

  const items = document.getElementById('items');
console.log('Diagnóstico items:', items);
console.log('Contenedor contenido:', document.getElementById('contenido'));
  const agregarItem = () => {

    const aviso = document.getElementById('aviso');
    const buscarProd = txt => productosLista.find(x => x.nombre.toUpperCase() === txt.trim().toUpperCase());
    const crudas = [...items.children].map(d => ({texto: d.querySelector('.prod').value.trim(), cantidad: parseFloat(d.querySelector('.cant').value)})).filter(l => l.texto);
    const noExiste = crudas.filter(l => !buscarProd(l.texto));
    if(noExiste.length) return aviso.innerHTML = `<div class="msg err">No está en la lista de productos: ${noExiste.map(l => esc(l.texto)).join(', ')}. Elegí uno de la lista o crealo en la solapa Productos.</div>`;
    const lineas = crudas.map(l => { const pr = buscarProd(l.texto); return {producto: pr.nombre, cantidad: l.cantidad, lleva_serie: pr.lleva_serie}; });
    if(!lineas.length || lineas.some(l => !(l.cantidad > 0))){
      return aviso.innerHTML = '<div class="msg err">Cargá al menos un producto con cantidad mayor a 0.</div>';
    }
    const btn = e.target.querySelector('[type=submit]');
    btn.disabled = true;
    const {data:p, error} = await sb.from('pedidos').insert({
      cliente: document.getElementById('cliente').value.trim(),
      modalidad: document.getElementById('modalidad').value,
      fecha_entrega: document.getElementById('fentrega').value || null,
      comentarios: document.getElementById('coment').value.trim() || null,
      creado_por: perfil.id
    }).select().single();
    if(error){ btn.disabled = false; return aviso.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; }
    const {error:e2} = await sb.from('pedido_items').insert(lineas.map(l => ({...l, pedido_id: p.id})));
    if(e2){
      await sb.from('pedidos').delete().eq('id', p.id);
      btn.disabled = false;
      return aviso.innerHTML = `<div class="msg err">No se pudo guardar los productos: ${esc(e2.message)}</div>`;
    }
    vistaVentas();
  };

  // Los filtros solo recargan la lista (no borran lo que estás escribiendo en el formulario)
  document.querySelectorAll('.pill-btn').forEach(b => {
    b.onclick = () => {
      filtroEstadoPill = b.dataset.f;
      document.querySelectorAll('.pill-btn').forEach(x => x.classList.toggle('activa', x === b));
      cargarResultadosVentas();
    };
  });

  suscribirPedidos();
  refrescarVentas();
}

/* Tiempo real: cuando alguien crea o cambia un pedido, se actualiza la lista sola */
let canalPedidos = null, tRefresco;
function suscribirPedidos(){
  if(canalPedidos) sb.removeChannel(canalPedidos);
  canalPedidos = sb.channel('pedidos-ventas')
    .on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, () => {
      clearTimeout(tRefresco); tRefresco = setTimeout(() => { if(document.getElementById('res-ventas')) refrescarVentas(); if(document.getElementById('res-dep')) cargarPedidosDeposito(); }, 700);
    }).subscribe();
}
function refrescarVentas(){ cargarEstadisticas(); cargarResultadosVentas(); }

async function cargarEstadisticas(){
  const box = document.getElementById('stats'); if(!box) return;
  const {data} = await sb.from('pedidos').select('estado');
  const n = e => (data || []).filter(p => p.estado === e).length;
  box.innerHTML = `
    <div class="stat-card"><span class="stat-num p">${n('pendiente')}</span><span class="stat-label">Pendientes</span></div>
    <div class="stat-card"><span class="stat-num l">${n('listo')}</span><span class="stat-label">Listos</span></div>
    <div class="stat-card"><span class="stat-num e">${n('entregado')}</span><span class="stat-label">Entregados</span></div>`;
}

async function cargarResultadosVentas(){
  const res = document.getElementById('res-ventas');
  if(!res) return;
  let q = sb.from('pedidos').select('*, pedido_items(*, series(*))').order('numero_remito',{ascending:false}).limit(50);
  if(filtroEstadoPill !== 'todos') q = q.eq('estado', filtroEstadoPill);
  const {data, error} = await q;
  if(error) return res.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  if(!data || !data.length){
    return res.innerHTML = `
      <div style="text-align:center; padding:40px 20px; color:var(--gris); background:#fff; border-radius:12px; border:1px dashed #EAECF0">
        <div style="font-size:32px; margin-bottom:8px">📦</div>
        <b>No hay pedidos en esta sección actualmente.</b>
      </div>`;
  }
  res.innerHTML = data.map(p => {
    const itemsHtml = p.pedido_items && p.pedido_items.length ? p.pedido_items.sort((a,b)=>a.id-b.id).map(i => `
      <div class="card-item-row">
        <div>
          ${i.lleva_serie ? '<span class="badge-s-u">S/U</span>' : ''}
          <span style="font-weight:500">${esc(i.producto)}</span>
          ${i.series && i.series.length ? `<small class="series">N.º de serie: ${i.series.map(s=>esc(s.numero_serie)).join(', ')}</small>` : ''}
        </div>
        <div style="background:#F1F5F9; padding:2px 8px; border-radius:6px; font-weight:600; font-size:13px">x${i.cantidad}</div>
      </div>`).join('') : '<div style="color:var(--gris); font-size:13px">Sin productos registrados</div>';
    return `
      <div class="card-pedido">
        <div class="card-pedido-header">
          <div>
            <h3>${esc(p.cliente)} <span class="etiqueta ${p.estado}">${ESTADOS[p.estado]}</span></h3>
            <div class="card-pedido-meta">
              <span>📅 Entrega: ${fmtFecha(p.fecha_entrega)}</span>
              <span>🚚 ${MODAL[p.modalidad]}</span>
              <span class="remito-chico">Remito ${fmtRemito(p.numero_remito)}</span>
            </div>
          </div>
          <div class="acciones-card">
            
            <button class="btn chico sec ver-remito-btn" data-id="${p.id}" style="padding:6px 12px; font-weight:600">Ver</button>
          </div>
        </div>
        <div class="card-items-box">
          <div style="font-size:11px; font-weight:700; color:#64748B; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px">Productos a sacar</div>
          ${itemsHtml}
        </div>
        ${p.comentarios ? `<div style="margin-top:10px; font-size:13px; color:#475467"><b>Nota:</b> ${esc(p.comentarios)}</div>` : ''}
      </div>`;
  }).join('');
  res.querySelectorAll('.ver-remito-btn').forEach(btn => {
    btn.onclick = () => detallePedido(btn.dataset.id, vistaVentas);
  });
}

/* ---------- DETALLE / REMITO ---------- */
async function detallePedido(id, volver){
  const c = document.getElementById('contenido');
  c.innerHTML = '<div class="panel vacio">Cargando…</div>';
  const {data:p, error} = await sb.from('pedidos').select('*, pedido_items(*, series(*))').eq('id', id).single();
  if(error) return c.innerHTML = `<div class="panel"><div class="msg err">${esc(error.message)}</div></div>`;
  const puedeAnular = ['ventas','admin'].includes(perfil.rol) && ['pendiente','listo'].includes(p.estado);
  const filas = p.pedido_items.sort((a,b)=>a.id-b.id).map(i => `
    <tr><td>${esc(i.producto)}${i.series?.length ? `<small class="series">N.º de serie: ${i.series.map(s=>esc(s.numero_serie)).join(', ')}</small>` : ''}</td>
    <td class="num">${i.cantidad}</td></tr>`).join('');
  c.innerHTML = `<div class="panel remito">
    <div class="no-print acciones sup"><button class="btn sec chico" id="volver">← Volver</button>
      <button class="btn chico" id="imprimir">Imprimir / guardar PDF</button>
      ${puedeAnular ? '<button class="btn chico peligro" id="anular">Anular pedido</button>' : ''}</div>
    <div class="enc"><img src="logo.png" alt="SGV" class="logo-remito">
      <div class="num-remito">Remito<b>${fmtRemito(p.numero_remito)}</b></div></div>
    <p><b>Cliente:</b> ${esc(p.cliente)}<br>
       <b>Estado:</b> <span class="etiqueta ${p.estado}">${ESTADOS[p.estado]}</span><br>
       <b>Entrega:</b> ${MODAL[p.modalidad]}<br>
       <b>Fecha de entrega:</b> ${fmtFecha(p.fecha_entrega)}<br>
       <b>Creado:</b> ${fmtFechaHora(p.creado_en)}${p.fecha_listo ? `<br><b>Listo:</b> ${fmtFechaHora(p.fecha_listo)}` : ''}
       ${p.fecha_entregado ? `<br><b>Entregado:</b> ${fmtFechaHora(p.fecha_entregado)}` : ''}</p>
    <table><thead><tr><th>Producto</th><th class="num">Cantidad</th></tr></thead><tbody>${filas}</tbody></table>
    ${p.comentarios ? `<p><b>Comentarios:</b> ${esc(p.comentarios)}</p>` : ''}
    ${p.enargas_transferido !== null ? `<p><b>Series transferidas en ENARGAS:</b> ${p.enargas_transferido ? 'Sí' : 'No'}</p>` : ''}
  </div>`;
  document.getElementById('volver').onclick = volver;
  document.getElementById('imprimir').onclick = () => window.print();
  const a = document.getElementById('anular');
  if(a) a.onclick = async () => {
    if(!confirm(`¿Anular el remito ${fmtRemito(p.numero_remito)}? No se puede deshacer.`)) return;
    const {error} = await sb.from('pedidos').update({estado:'anulado'}).eq('id', p.id);
    if(error) alert('No se pudo anular: ' + error.message); else detallePedido(p.id, volver);
  };
}

/* ---------- ADMIN: USUARIOS (funcional) ---------- */
async function vistaUsuarios(){
  const cont = document.getElementById('contenido');
  cont.innerHTML = `<div class="panel"><h2>Usuarios</h2><div id="lista" class="vacio">Cargando…</div></div>`;
  const {data,error} = await sb.from('profiles').select('*').order('creado_en',{ascending:false});
  const lista = document.getElementById('lista');
  if(error) return lista.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  lista.className = '';
  lista.innerHTML = data.map(u => `
    <div class="fila">
      <div class="dato"><b>${esc(u.nombre)}</b>
        <small>${u.rol==='pendiente' ? `<span class="etiqueta pendiente">Pidió: ${esc(ROLES[u.puesto_solicitado]||'—')}</span>` : ''}</small></div>
      <select data-id="${u.id}" data-campo="rol" aria-label="Puesto de ${esc(u.nombre)}" ${u.id===perfil.id?'disabled':''}>
        ${Object.entries(ROLES).map(([k,n])=>`<option value="${k}" ${u.rol===k?'selected':''}>${n}</option>`).join('')}
      </select>
      <select data-id="${u.id}" data-campo="activo" aria-label="Estado de ${esc(u.nombre)}" ${u.id===perfil.id?'disabled':''}>
        <option value="true" ${u.activo?'selected':''}>Activo</option>
        <option value="false" ${!u.activo?'selected':''}>Desactivado</option>
      </select>
    </div>`).join('') || '<p class="vacio">Todavía no hay usuarios.</p>';
  lista.querySelectorAll('select').forEach(s => s.onchange = async () => {
    const valor = s.dataset.campo === 'activo' ? s.value === 'true' : s.value;
    const {error} = await sb.from('profiles').update({[s.dataset.campo]: valor}).eq('id', s.dataset.id);
    if(error) alert('No se pudo guardar: ' + error.message);
    vistaUsuarios();
  });
}

/* ---------- ARRANQUE ---------- */
sb.auth.onAuthStateChange((evento, sesion) => {
  if(sesion) setTimeout(cargarPerfil, 0); else { perfil = null; pantallaLogin(); }
});
sb.auth.getSession().then(({data:{session}}) => { if(!session) pantallaLogin(); });
</script>

      console.log("SGV: service worker registrado");
    } catch (error) {
      console.error("SGV: error al registrar service worker", error);
    }
  });
}
