<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SGV Pedidos">
  <title>Distribuidora SGV</title>
  <meta name="theme-color" content="#1565B8">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SGV Pedidos">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #1565B8;
      --azul-osc: #0F4C8C;
      --rojo: #D8262F;
      --tinta: #14202E;
      --gris: #5B6B7D;
      --linea: #D9E0E8;
      --fondo: #F2F5F9;
      --blanco: #fff;
      --ok: #1E8E4E
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Barlow, system-ui, sans-serif;
      background: var(--fondo);
      color: var(--tinta);
      font-size: 16px
    }

    button,
    input,
    select {
      font: inherit
    }

    :focus-visible {
      outline: 3px solid var(--azul);
      outline-offset: 2px
    }

    .centro {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .caja {
      background: var(--blanco);
      border-radius: 10px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 14px rgba(20, 32, 46, .08);
      border-top: 5px solid var(--rojo)
    }

    .caja img.logo {
      display: block;
      width: 170px;
      margin: 0 auto 6px
    }

    .caja h1 {
      font-size: 22px;
      text-align: center;
      margin: 0 0 20px;
      font-weight: 600
    }

    label {
      display: block;
      font-weight: 500;
      margin: 14px 0 5px;
      font-size: 15px
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--linea);
      border-radius: 6px;
      background: #fff;
      font-size: 16px
    }

    .btn {
      background: var(--azul);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 20px
    }

    .btn:hover {
      background: var(--azul-osc)
    }

    .btn.chico {
      width: auto;
      margin: 0;
      padding: 8px 14px;
      font-size: 14px
    }

    .btn.sec {
      background: #fff;
      color: var(--azul);
      border: 1px solid var(--azul)
    }

    .link {
      background: none;
      border: 0;
      color: var(--azul);
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      margin-top: 16px;
      display: block;
      width: 100%;
      text-align: center
    }

    .msg {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 15px
    }

    .msg.err {
      background: #FDECEC;
      color: #9B1C22
    }

    .msg.ok {
      background: #E7F5ED;
      color: #17653A
    }

    header {
      background: var(--blanco);
      border-bottom: 4px solid var(--azul);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      flex-wrap: wrap
    }

    header img {
      height: 42px
    }

    header .quien {
      margin-left: auto;
      text-align: right;
      font-size: 14px;
      line-height: 1.25
    }

    header .quien b {
      display: block;
      font-size: 15px
    }

    nav {
      display: flex;
      gap: 4px;
      padding: 10px 16px 0;
      overflow-x: auto
    }

    nav button {
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 10px 14px;
      font-weight: 600;
      color: var(--gris);
      cursor: pointer;
      white-space: nowrap
    }

    nav button.activa {
      color: var(--azul);
      border-color: var(--rojo)
    }

    main {
      padding: 20px;
      max-width: 1300px;
      margin: 0 auto
    }

    .panel {
      background: #fff;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 14px rgba(20, 32, 46, .06)
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 19px
    }

    .fila {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 0;
      border-top: 1px solid var(--linea)
    }

    .fila:first-of-type {
      border-top: 0
    }

    .fila .dato {
      flex: 1;
      min-width: 160px
    }

    .fila .dato small {
      display: block;
      color: var(--gris)
    }

    .fila select {
      width: auto;
      min-width: 130px
    }

    .etiqueta {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      background: #E4ECF6;
      color: var(--azul-osc)
    }

    .etiqueta.pendiente {
      background: #FFF1D6;
      color: #8A5A00
    }

    .vacio {
      color: var(--gris);
      padding: 10px 0
    }

    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px
    }

    .barra h2 {
      margin: 0
    }

    .filtros {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0 12px;
      align-items: end;
      margin-bottom: 10px
    }

    .filtros label {
      margin-top: 10px
    }

    button.item {
      width: 100%;
      text-align: left;
      background: none;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      cursor: pointer;
      color: inherit
    }

    button.item:hover {
      background: #F2F5F9
    }

    .etiqueta.listo {
      background: #DDF1E5;
      color: #17653A
    }

    .etiqueta.entregado {
      background: #DCE8F8;
      color: var(--azul-osc)
    }

    .etiqueta.anulado {
      background: #EEE;
      color: #666
    }

    .item-form {
      display: flex;
      gap: 8px;
      margin-top: 8px
    }

    .item-form .prod {
      flex: 1
    }

    .item-form .cant {
      width: 90px
    }

    .acciones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .acciones .btn {
      flex: 1
    }

    .acciones .btn.chico {
      flex: none
    }

    .btn.peligro {
      background: var(--rojo)
    }

    .sup {
      margin-bottom: 16px
    }

    .enc {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--azul);
      padding-bottom: 10px;
      margin-bottom: 12px
    }

    .logo-remito {
      height: 54px
    }

    .num-remito {
      text-align: right
    }

    .num-remito b {
      display: block;
      font-size: 24px
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 9px 6px;
      border-bottom: 1px solid var(--linea);
      text-align: left;
      vertical-align: top
    }

    .num {
      text-align: right;
      white-space: nowrap
    }

    .series {
      display: block;
      color: var(--gris);
      font-size: 13px
    }

    @media print {

      header,
      nav,
      .no-print {
        display: none !important
      }

      body {
        background: #fff
      }

      .panel {
        box-shadow: none;
        padding: 0
      }

      main {
        padding: 0
      }
    }

    /* --- ESTILOS DASHBOARD DOS COLUMNAS VENTAS --- */
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .dash-title h2 {
      margin: 0;
      font-size: 24px;
      color: #101828;
    }

    .dash-title p {
      margin: 4px 0 0;
      color: #667085;
      font-size: 14px;
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #EAECF0;
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 120px;
    }

    .stat-num {
      font-size: 18px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .stat-num.p {
      background: #FEF3F2;
      color: #B42318;
    }

    .stat-num.l {
      background: #ECFDF3;
      color: #027A48;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: #344054;
      text-transform: uppercase;
    }

    .sync-banner {
      background: #ECFDF3;
      border: 1px solid #A6F4C5;
      color: #027A48;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-dash {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 950px) {
      .grid-dash {
        grid-template-columns: 1fr;
      }
    }

    .pills {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: #fff;
      border: 1px solid #EAECF0;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      color: #344054;
      cursor: pointer;
    }

    .pill-btn.activa {
      background: #0F172A;
      color: #fff;
      border-color: #0F172A;
    }

    .item-form-grid {
      display: grid;
      grid-template-columns: 1fr 80px 36px;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .card-pedido {
      background: #fff;
      border: 1px solid #EAECF0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05);
    }

    .card-pedido-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-pedido-header h3 {
      margin: 0;
      font-size: 20px;
      color: #101828;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .card-pedido-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #475467;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .card-items-box {
      background: #F8FAFC;
      border: 1px solid #EAECF0;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .card-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #EAECF0;
      font-size: 14px;
      color: #334155;
    }

    .card-item-row:last-child {
      border-bottom: 0;
    }

    .badge-s-u {
      background: #E2E8F0;
      color: #475467;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-right: 6px;
    }

    /* --- Ajustes dashboard: cliente protagonista, remito discreto --- */
    .card-pedido-header {
      flex-wrap: wrap;
      gap: 10px
    }

    .card-pedido-header h3 {
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: .2px;
      flex-wrap: wrap;
      line-height: 1.2
    }

    .card-pedido-header h3 .etiqueta {
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px
    }

    .card-pedido-meta {
      margin-bottom: 14px;
      margin-top: 6px
    }

    .remito-chico {
      color: #98A2B3;
      font-weight: 500
    }

    .acciones-card {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .stat-num.e {
      background: #EFF4FF;
      color: #1849A9
    }

    .nuevo-movil {
      display: none;
      margin: 0 0 14px
    }

    @media (max-width:950px) {
      .col-form {
        display: none
      }

      .col-form.abierto {
        display: block
      }

      .nuevo-movil {
        display: block
      }
    }

    .chip-serie {
      display: inline-block;
      background: #EEF2F6;
      border: 1px solid #D9E0E8;
      border-radius: 6px;
      padding: 2px 8px;
      margin: 4px 6px 0 0;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px
    }

    .lista-series {
      margin-top: 4px
    }

    .check-serie {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 0 12px;
      font-weight: 500;
      font-size: 14px
    }

    .check-serie input {
      width: auto
    }

    .badge-cant {
      background: #F1F5F9;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px
    }

    .enargas-box {
      margin-top: 16px;
      padding: 14px;
      border: 2px solid var(--azul);
      border-radius: 10px;
      background: #F2F7FD
    }

    .serie-num {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 17px
    }

    .fila.inactivo {
      opacity: .55
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.SGV_CONFIG;
    const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const app = document.getElementById('app');
    const SGV_VAPID_PUBLIC_KEY = "BGNwTqirxP8YUBhtUuAva4U3FcQdteuzhVE-QUAFtkB2mrmfQ-9y3CqZGkxtjbo3ax8fiXiBU8UNouNlA_dMovc";

    function sgvBase64UrlToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");
      const rawData = atob(base64);
      return Uint8Array.from(rawData, c => c.charCodeAt(0));
    }

    async function activarNotificaciones() {
      try {
        if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
          alert("Este navegador no admite notificaciones push.");
          return;
        }

        if (!("Notification" in window)) {
          alert("Este navegador no admite notificaciones.");
          return;
        }

        if (!perfil || !perfil.id) {
          alert("Primero tenés que iniciar sesión.");
          return;
        }

        const permiso = await Notification.requestPermission();

        if (permiso !== "granted") {
          alert("No se concedió permiso para las notificaciones.");
          return;
        }

        const registro = await navigator.serviceWorker.ready;
        let suscripcion = await registro.pushManager.getSubscription();

        if (!suscripcion) {
          suscripcion = await registro.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: sgvBase64UrlToUint8Array(
              SGV_VAPID_PUBLIC_KEY
            )
          });
        }

        const { error } = await sb
          .from("push_subscriptions")
          .upsert(
            {
              user_id: perfil.id,
              subscription: suscripcion.toJSON()
            },
            { onConflict: "user_id,subscription" }
          );

        if (error) throw error;

        alert("¡Notificaciones activadas en este dispositivo!");
      } catch (error) {
        console.error("Error al activar notificaciones:", error);
        alert("No se pudieron activar las notificaciones. Revisá la consola para ver el error.");
      }
    }
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ROLES = {
      admin: 'Administrador',
      supervisor: 'Supervisor',
      ventas: 'Ventas',
      deposito: 'Depósito',
      pendiente: 'Sin asignar'
    };
    let perfil = null, vista = null;
    let filtros = { numero: '', cliente: '', estado: '', listo: '', entrega: '' };
    /* ---------- ENTRADA ---------- */
    function pantallaLogin(modo = 'entrar', aviso = null) {
      const nuevo = modo === 'crear';
      app.innerHTML = `
  <div class="centro"><div class="caja">
    <img class="logo" src="logo.png" alt="SGV">
    <h1>Bienvenido a Distribuidora SGV</h1>
    <form id="f">
      ${nuevo ? `<label for="nombre">Nombre</label><input id="nombre" required autocomplete="name">
      <label for="puesto">Puesto</label>
      <select id="puesto"><option value="ventas">Ventas</option><option value="deposito">Depósito</option></select>` : ''}
      <label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="email">
      <label for="pass">Contraseña</label><input id="pass" type="password" required minlength="6" autocomplete="${nuevo ? 'new-password' : 'current-password'}">
      <button class="btn" type="submit">${nuevo ? 'Crear usuario' : 'Entrar'}</button>
    </form>
    <div id="aviso">${aviso ? `<div class="msg ${aviso.tipo}">${esc(aviso.texto)}</div>` : ''}</div>
    <button class="link" id="cambiar">${nuevo ? 'Ya tengo usuario' : 'Crear usuario nuevo'}</button>
  </div></div>`;
      document.getElementById('cambiar').onclick = () => pantallaLogin(nuevo ? 'entrar' : 'crear');
      document.getElementById('f').onsubmit = async e => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('pass').value;
        let r;
        if (nuevo) {
          r = await sb.auth.signUp({
            email, password, options: {
              data: {
                nombre: document.getElementById('nombre').value.trim(),
                puesto: document.getElementById('puesto').value
              }
            }
          });
          if (!r.error && !r.data.session) {
            return pantallaLogin('entrar', {
              tipo: 'ok',
              texto: 'Registro recibido. Si te llegó el correo de confirmación, confirmalo primero. Después, tu cuenta quedará pendiente de aprobación del administrador antes de poder ingresar.'
            });
          }
        } else {
          r = await sb.auth.signInWithPassword({ email, password });
        }
        if (r.error) document.getElementById('aviso').innerHTML = `<div class="msg err">${esc(traducir(r.error.message))}</div>`;
      };
    }
    function traducir(m) {
      if (/Invalid login/i.test(m)) {
        return 'No se pudo iniciar sesión. Revisá el correo y la contraseña. Si acabás de registrarte, confirmá primero tu correo.';
      }
      if (/already registered/i.test(m)) {
        return 'Ese correo ya tiene un usuario creado. Probá iniciar sesión.';
      }
      if (/Email not confirmed/i.test(m)) {
        return 'Primero confirmá tu correo con el mensaje que te llegó.';
      }
      return m;
    }
    /* ---------- SISTEMA ---------- */
    function pantallaEspera() {
      document.body.innerHTML = `
    <main style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      background:#f4f7fb;
      font-family:Arial,sans-serif;
      color:#12243a;
    ">
      <section style="
        width:100%;
        max-width:420px;
        padding:32px 24px;
        box-sizing:border-box;
        background:white;
        border-radius:16px;
        text-align:center;
        box-shadow:0 8px 30px rgba(0,0,0,.08);
      ">
        <h2 style="margin-top:0">Distribuidora SGV</h2>
        <h3>Cuenta pendiente de aprobación</h3>
        <p>
          Tu registro fue recibido. El administrador debe activar
          tu cuenta y asignarte un rol antes de que puedas ingresar.
        </p>
        <button id="btnCerrarSesion" style="
          margin-top:16px;
          padding:12px 20px;
          border:0;
          border-radius:8px;
          background:#1565B8;
          color:white;
          cursor:pointer;
          font-size:16px;
        ">
          Cerrar sesión
        </button>
      </section>
    </main>
  `;

      document.getElementById('btnCerrarSesion').onclick = async () => {
        await sb.auth.signOut();
        location.reload();
      };
    }
    async function cargarPerfil() {
      const { data: { user } } = await sb.auth.getUser();
      const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
      if (error || !data) { await sb.auth.signOut(); return; }
      perfil = data;
      if (!perfil.activo || perfil.rol === 'pendiente') return pantallaEspera();
      armarSistema();
    }
    function cabecera() {
      return `
    <header>
      <img src="logo.png" alt="SGV">
      <div class="quien">
        <b>${esc(perfil.nombre || '')}</b>
        ${esc(ROLES[perfil.rol] || perfil.rol || '')}
      </div>
      <button class="btn sec chico" id="activar-notificaciones" type="button">
        Activar notificaciones
      </button>

      async function cambiarCuentaCorriente(clienteId, activaAhora) {
        const cliente = clientes.find(
          cl => Number(cl.id) === Number(clienteId)
        );

        if (!cliente) return;

        if (cliente.activo === false) {
          alert('No se puede cambiar la cuenta corriente de un cliente inactivo.');
          return;
        }

        if (activaAhora) {
          // Verificar el saldo antes de permitir deshabilitar la cuenta.
          const { data: cuenta, error: errorCuenta } = await sb
            .from('cuentas_corrientes_resumen')
            .select('saldo')
            .eq('cliente_id', clienteId)
            .maybeSingle();

          if (errorCuenta || !cuenta) {
            alert(
              'No se pudo verificar el saldo. Por seguridad, la cuenta no se deshabilitó.'
            );
            return;
          }

          if (Math.abs(Number(cuenta.saldo || 0)) > 0.009) {
            alert(
              'No se puede deshabilitar esta cuenta porque tiene un saldo distinto de cero. Revisá el saldo antes de continuar.'
            );
            return;
          }

          if (!confirm(
            '¿Deshabilitar la cuenta corriente de este cliente? Se conservará su historial.'
          )) return;

        } else {
          if (!confirm(
            '¿Habilitar la cuenta corriente? Los pedidos futuros podrán generar cargos al entregarse. Hacelo solo cuando los precios y el módulo estén preparados.'
          )) return;
        }

        const { error } = await sb
          .from('clientes')
          .update({ tiene_cuenta_corriente: !activaAhora })
          .eq('id', clienteId);

        if (error) {
          alert('No se pudo cambiar la cuenta corriente: ' + error.message);
          return;
        }

        alert(
          activaAhora
            ? 'Cuenta corriente deshabilitada.'
            : 'Cuenta corriente habilitada.'
        );

        await cargarClientes();
      }

        const medio = fila.querySelector('.caja-medio');

        const contNumero = fila.querySelector('.caja-numero-contenedor');
        const contEcheq = fila.querySelector('.caja-echeq-contenedor');

        function actualizarCampos() {
          const esCheque = medio.value === 'cheque';
          const esEcheq = medio.value === 'echeq';
          datos.hidden = !esCheque && !esEcheq;
          contNumero.hidden = !esCheque;
          contEcheq.hidden = !esEcheq;
          fila.querySelector('.caja-titular').required = esCheque || esEcheq;
          fila.querySelector('.caja-banco').required = esCheque || esEcheq;
          fila.querySelector('.caja-vencimiento').required = esCheque || esEcheq;
          fila.querySelector('.caja-numero-cheque').required = esCheque;
          fila.querySelector('.caja-identificador-echeq').required = esEcheq;
        }

        medio.onchange = actualizarCampos;
        fila.querySelector('.caja-quitar').onclick = () => {
          fila.remove();
          actualizarTotalCaja();

        fila.querySelectorAll('input,select').forEach(el => {
          el.addEventListener('input', actualizarTotalCaja);
          el.addEventListener('change', actualizarTotalCaja);

      document.getElementById('caja-agregar-valor').onclick = agregarValorCaja;
      agregarValorCaja();

      selectorCliente.onchange = async () => {
        selectorPedido.innerHTML = '<option value="">Sin pedido asociado</option>';
        aplicarCC.checked = false;

        const cliente = (clientes || []).find(
          cl => Number(cl.id) === Number(selectorCliente.value)
        );

        contenedorCC.hidden = !cliente?.tiene_cuenta_corriente;

        if (!cliente?.id) return;

        const { data: pedidos, error } = await sb
          .from('pedidos')
          .select('id,numero_remito,estado,creado_en')
          .eq('cliente_id', cliente.id)
          .order('creado_en', { ascending: false })
          .limit(50);

          aviso.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;

          '<option value="">Sin pedido asociado</option>' +
          (pedidos || []).map(p => `
        <option value="${Number(p.id)}">
          ${esc(fmtRemito(p.numero_remito))} — ${esc(p.estado || '')}
        </option>
      `).join('');
      };

      async function cargarHistorialCaja() {
        const historial = document.getElementById('caja-historial');

        const { data: cobros, error } = await sb
          .from('caja_cobros')
          .select('id,cliente_id,pedido_id,importe_total,observaciones,creado_en')
          .order('creado_en', { ascending: false })
          .limit(30);

        if (error) {
          historial.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
          return;
        }

        const nombres = new Map(
          (clientes || []).map(cl => [Number(cl.id), cl.nombre])
        );

        historial.className = '';

        historial.innerHTML = cobros?.length ? `
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Recibo</th>
              <th>Fecha</th>
              <th>Cliente</th>
              <th class="num">Importe</th>
              <th>Comprobante</th>
            </tr>
          </thead>
          <tbody>
            ${cobros.map(x => `
              <tr>
                <td>RC-${String(x.id).padStart(6, '0')}</td>
                <td>${new Date(x.creado_en).toLocaleString('es-AR')}</td>
                <td>${esc(nombres.get(Number(x.cliente_id)) || 'Cliente')}</td>
                <td class="num">${dinero(x.importe_total)}</td>
                <td>
                  <button type="button" class="btn sec chico caja-imprimir"
                    data-id="${Number(x.id)}">
                    Descargar PDF
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : '<p class="vacio">Todavía no hay cobros registrados.</p>';

        historial.querySelectorAll('.caja-imprimir').forEach(b => {
          b.onclick = () => imprimirComprobanteCaja(Number(b.dataset.id));
        });
      }

      form.onsubmit = async e => {
        e.preventDefault();
        aviso.innerHTML = '';

        const clienteId = Number(selectorCliente.value);
        const cliente = (clientes || []).find(
          cl => Number(cl.id) === clienteId
        );

        if (!cliente) {
          aviso.innerHTML = '<div class="msg err">Seleccioná un cliente válido.</div>';
          return;
        }

        const filas = [...valoresContenedor.querySelectorAll('.caja-valor')];

        const valores = filas.map(fila => ({
          medio_pago: fila.querySelector('.caja-medio').value,
          importe: Number(fila.querySelector('.caja-importe').value),
          titular: fila.querySelector('.caja-titular').value.trim() || null,
          cuit_titular: fila.querySelector('.caja-cuit').value.trim() || null,
          banco: fila.querySelector('.caja-banco').value.trim() || null,
          numero_cheque: fila.querySelector('.caja-numero-cheque').value.trim() || null,
          identificador_echeq: fila.querySelector('.caja-identificador-echeq').value.trim() || null,
          fecha_vencimiento: fila.querySelector('.caja-vencimiento').value || null,
          observaciones: fila.querySelector('.caja-observaciones-valor').value.trim() || null
        }));

        if (!valores.length || valores.some(v =>
          !Number.isFinite(v.importe) || v.importe <= 0
        )) {
          aviso.innerHTML = '<div class="msg err">Ingresá un importe mayor que cero para cada medio de pago.</div>';
          return;
        }

        const aplicar = aplicarCC.checked;

        if (aplicar && !cliente.tiene_cuenta_corriente) {
          aviso.innerHTML = '<div class="msg err">Este cliente no tiene una cuenta corriente habilitada.</div>';
          return;
        }

        const boton = document.getElementById('caja-guardar');
        boton.disabled = true;

        try {
          const { data: cobroId, error } = await sb.rpc(
            'registrar_cobro_caja',
            {
              p_cliente_id: clienteId,
              p_pedido_id: selectorPedido.value
                ? Number(selectorPedido.value)
                : null,
              p_aplicar_cuenta_corriente: aplicar,
              p_observaciones:
                document.getElementById('caja-observaciones').value.trim() || null,
              p_valores: valores
            }
          );

          if (error) {
            aviso.innerHTML = `<div class="msg err">No se pudo registrar el cobro: ${esc(error.message)}</div>`;
            return;
          }

          const recibo = Number(cobroId);

          aviso.innerHTML = `
        <div class="msg ok">
          Cobro registrado correctamente: <b>RC-${String(recibo).padStart(6, '0')}</b>.
          <p>El comprobante es opcional.</p>
          <button type="button" class="btn chico" id="caja-descargar-ahora">
            Descargar comprobante PDF
          </button>
          <button type="button" class="btn sec chico" id="caja-no-descargar">
            Ahora no
          </button>
        </div>
      `;

          document.getElementById('caja-descargar-ahora').onclick =
            () => imprimirComprobanteCaja(recibo);

          document.getElementById('caja-no-descargar').onclick = () => {
            aviso.innerHTML =
              '<div class="msg ok">Cobro registrado. No se descargó el comprobante.</div>';
          };

          form.reset();
          selectorPedido.innerHTML = '<option value="">Sin pedido asociado</option>';
          aplicarCC.checked = false;
          contenedorCC.hidden = true;
          valoresContenedor.innerHTML = '';
          agregarValorCaja();
          actualizarTotalCaja();

          await cargarHistorialCaja();

        } finally {
          boton.disabled = false;
        }
      };

      await cargarHistorialCaja();
    }

    /* ---------- DEPÓSITO ---------- */
    let depTab = 'pendiente';
    const DEP_TABS = [['pendiente', 'Para preparar'], ['listo', 'Listos para entregar'], ['entregado', 'Entregados']];

    function vistaDeposito() {
      const c = document.getElementById('contenido');
      c.innerHTML = `<div class="panel">
    <div class="barra"><h2>Depósito</h2></div>
    <div class="pills">${DEP_TABS.map(([k, n]) => `<button class="pill-btn ${depTab === k ? 'activa' : ''}" data-t="${k}">${n}</button>`).join('')}</div>
    <div class="filtros">
      <div><label for="d-numero">N.º de remito</label><input id="d-numero" type="number" min="1" value="${esc(filtros.numero)}"></div>
      <div><label for="d-cliente">Cliente</label><input id="d-cliente" value="${esc(filtros.cliente)}"></div>
      <div><button class="btn sec chico" id="d-limpiar" style="margin-top:0">Limpiar filtros</button></div>
    </div>
    <div id="res-dep" class="vacio">Cargando…</div></div>`;
      let t;
      const buscar = () => { clearTimeout(t); t = setTimeout(cargarPedidosDeposito, 300); };
      document.getElementById('d-numero').oninput = e => { filtros.numero = e.target.value; buscar(); };
      document.getElementById('d-cliente').oninput = e => { filtros.cliente = e.target.value; buscar(); };
      document.getElementById('d-limpiar').onclick = () => { filtros.numero = ''; filtros.cliente = ''; vistaDeposito(); };
      c.querySelectorAll('.pill-btn').forEach(b => b.onclick = () => { depTab = b.dataset.t; vistaDeposito(); });
      suscribirPedidos();
      cargarPedidosDeposito();
    }

    async function cargarPedidosDeposito() {
      const res = document.getElementById('res-dep'); if (!res) return;
      let q = sb.from('pedidos').select('*, pedido_items(*, series(*))').eq('estado', depTab)
        .order('numero_remito', { ascending: depTab === 'pendiente' }).limit(100);
      const n = parseInt(filtros.numero, 10);
      if (filtros.numero && !isNaN(n)) q = q.eq('numero_remito', n);
      if (filtros.cliente && filtros.cliente.trim()) q = q.ilike('cliente', `%${filtros.cliente.trim()}%`);
      const { data, error } = await q;
      if (error) return res.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
      res.className = '';
      const vacio = { pendiente: 'No hay pedidos para preparar en este momento.', listo: 'No hay pedidos listos esperando entrega.', entregado: 'Todavía no hay pedidos entregados.' }[depTab];
      res.innerHTML = data.length ? data.map(p => {
        const nSeries = p.pedido_items.reduce((a, i) => a + (i.series ? i.series.length : 0), 0);
        return `
    <button class="fila item item-deposito" data-id="${p.id}">
      <div class="dato"><b style="font-size:18px;text-transform:uppercase">${esc(p.cliente)}</b>
        <small>Presupuesto ${fmtRemito(p.numero_remito)}${nSeries ? ` · ${nSeries} n.º de serie cargados` : ''}</small></div>
      <div class="dato"><span class="etiqueta ${p.estado}">${ESTADOS[p.estado]}</span>
        <small>${MODAL[p.modalidad]} · Entrega: ${fmtFecha(p.fecha_entrega)}</small></div>
    </button>`;
      }).join('') : `<p class="vacio">${vacio}</p>`;
      res.querySelectorAll('.item-deposito').forEach(b => b.onclick = () => detallePedidoDeposito(b.dataset.id));
    }

    async function detallePedidoDeposito(id, editando = false) {
      const c = document.getElementById('contenido');
      c.innerHTML = '<div class="panel vacio">Cargando…</div>';
      await cargarProductos();
      const { data: p, error } = await sb.from('pedidos').select('*, pedido_items(*, series(*))').eq('id', id).single();
      if (error) return c.innerHTML = `<div class="panel"><div class="msg err">${esc(error.message)}</div></div>`;

      const items = p.pedido_items.sort((a, b) => a.id - b.id);
      const abierto = ['pendiente', 'listo'].includes(p.estado);
      const tieneKits = items.some(i =>
        i.es_kit === true || i.padre_item_id != null
      );
      editando = editando && abierto && !tieneKits;
      const prep = i => Math.min(Number(i.cantidad_preparada || 0), Number(i.cantidad));
      const completo = i =>
        i.es_kit === true || prep(i) >= Number(i.cantidad);
      const req = i => i.series_requeridas ?? Math.ceil(i.cantidad);
      const faltaSerie = i => i.lleva_serie ? Math.max(0, req(i) - (i.series || []).length) : 0;

      const filas = editando
        ? `<tr><td><div style="display:grid;grid-template-columns:1fr 80px 36px;gap:8px;font-size:12px;font-weight:600;color:var(--gris)"><span>PRODUCTO</span><span>CANT.</span><span></span></div>
        <datalist id="lista-productos">${productosLista.map(x => `<option value="${esc(x.nombre)}">`).join('')}</datalist>
        <div id="ed-items">${items.map(i => `<div class="item-form-grid ed-row" data-item-id="${i.id}">
          <input class="prod" list="lista-productos" value="${esc(i.producto)}" aria-label="Producto" autocomplete="off">
          <input class="cant" type="number" step="any" min="0" value="${i.cantidad}" aria-label="Cantidad">
          <button type="button" class="quitar" aria-label="Quitar">✕</button></div>`).join('')}</div>
        <button type="button" class="btn sec chico" id="ed-mas" style="margin-top:10px;width:100%;border-style:dashed">+ Agregar producto</button></td></tr>`
        : items.map(i => {
          if (i.es_kit === true) {
            return `<tr>
          <td style="background:#f4f7fb;padding:12px;border-radius:8px">
            <b style="font-size:16px">📦 ${esc(i.producto)}</b>
            <span class="badge-cant">x${i.cantidad}</span>
            <small style="display:block;margin-top:5px">
              Componentes del kit — preparalos por separado debajo.
            </small>
          </td>
        </tr>`;
          }
          const ser = i.series || [], falta = faltaSerie(i);
          const chips = ser.length ? ser.map(s => `<span class="chip-serie">${esc(s.numero_serie)}${abierto ? `<button type="button" class="del-serie" data-id="${s.id}" title="Quitar" style="background:none;border:0;color:var(--rojo);cursor:pointer;padding:0 0 0 6px">✕</button>` : ''}</span>`).join('') : '<small class="series">Sin números de serie</small>';
          return `<tr><td style="${i.padre_item_id ? 'padding-left:28px;border-left:3px solid var(--blue);' : ''}">
        ${i.padre_item_id ? '<small style="display:block;color:var(--gris);margin-bottom:4px">↳ COMPONENTE DEL KIT</small>' : ''}
        <b>${esc(i.producto)}</b> <span class="badge-cant">x${i.cantidad}</span>
        ${abierto ? `<label class="check-serie"><input type="checkbox" class="chk-lleva" data-item-id="${i.id}" ${i.lleva_serie ? 'checked' : ''}> Lleva n.º de serie</label>` : (i.lleva_serie ? '<span class="badge-s-u">S/U</span>' : '')}
        ${abierto ? `<div class="item-form" style="align-items:center;margin-top:6px">
          <label class="check-serie" style="margin:0"><input type="checkbox" class="chk-prep" data-item-id="${i.id}" ${completo(i) ? 'checked' : ''}> Preparado</label>
          <input type="number" class="inp-prep" data-item-id="${i.id}" step="any" min="0" max="${i.cantidad}" value="${prep(i)}" style="width:90px;padding:6px" aria-label="Cantidad preparada"> <small>de ${i.cantidad}</small></div>`
              : `<div><small class="series">Preparado: ${prep(i)} de ${i.cantidad}</small></div>`}
        ${abierto && i.lleva_serie ? `<div class="item-form" style="align-items:center;margin-top:6px">
          <label style="margin:0;font-size:14px">¿Cuántos n.º de serie cargar?</label>
          <input type="number" class="inp-req" data-item-id="${i.id}" min="0" step="1" value="${req(i)}" style="width:80px;padding:6px"></div>` : ''}
        <div class="lista-series">${chips}</div>
        ${abierto && falta > 0 ? `<div class="casillas" data-item-id="${i.id}">
          ${Array.from({ length: falta }, (_, k) => `<input class="input-serie" data-item-id="${i.id}" placeholder="N.º de serie ${ser.length + k + 1} de ${req(i)}" style="font-size:14px;padding:8px;margin-top:6px">`).join('')}
          <button type="button" class="btn chico btn-add-serie" data-item-id="${i.id}" style="margin-top:8px">Guardar números de serie</button></div>` : ''}
      </td></tr>`;
        }).join('');

      const haySeries = items.some(i => i.series && i.series.length);
      let acciones = '<button class="btn sec chico" id="volver-dep">← Volver</button>';
      if (editando) {
        acciones += '<button class="btn chico" id="ed-guardar" style="background:var(--ok)">Guardar cambios</button><button class="btn sec chico" id="ed-cancelar">Cancelar edición</button>';
      } else {
        if (abierto && !tieneKits) {
          acciones += '<button class="btn sec chico" id="editar">✏️ Editar pedido</button>';
        } else if (abierto && tieneKits) {
          acciones += '<small>Los pedidos con Kits no se pueden editar de forma general.</small>';
        }
        if (p.estado === 'pendiente') acciones += '<button class="btn chico" id="marcar-listo" style="background:var(--ok)">Marcar pedido como LISTO</button>';
        if (p.estado === 'listo') acciones += `<button class="btn chico" id="marcar-entregado" style="background:var(--ok)">${p.modalidad === 'despacho' ? 'Marcar como DESPACHADO' : 'Marcar como ENTREGADO'}</button>`;
        if (p.estado === 'entregado' && haySeries && p.enargas_transferido !== true) acciones += '<button class="btn chico" id="marcar-enargas">Marcar series transferidas en ENARGAS</button>';
      }

      c.innerHTML = `<div class="panel remito">
    <div class="acciones sup">${acciones}</div>
    <div class="enc"><img src="logo.png" alt="SGV" class="logo-remito">
      <div class="num-remito">Presupuesto<b>${fmtRemito(p.numero_remito)}</b></div></div>
    <p><b>Cliente:</b> <span style="font-size:18px;text-transform:uppercase;font-weight:700">${esc(p.cliente)}</span><br>
       <b>Estado:</b> <span class="etiqueta ${p.estado}">${ESTADOS[p.estado]}</span><br>
       <b>Modalidad:</b> ${MODAL[p.modalidad]}<br>
       <b>Fecha de entrega:</b> ${fmtFecha(p.fecha_entrega)}
       ${p.fecha_listo ? `<br><b>Listo:</b> ${fmtFechaHora(p.fecha_listo)}` : ''}
       ${p.fecha_entregado ? `<br><b>Entregado:</b> ${fmtFechaHora(p.fecha_entregado)}` : ''}
       ${p.comentarios ? `<br><b>Nota:</b> ${esc(p.comentarios)}` : ''}
       ${p.enargas_transferido !== null ? `<br><b>Series transferidas en ENARGAS:</b> ${p.enargas_transferido ? 'Sí' : 'No'}` : ''}</p>
    <table><thead><tr><th>${editando ? 'Editando productos del pedido' : 'Productos, preparación y números de serie'}</th></tr></thead><tbody>${filas}</tbody></table>
    <div id="aviso-dep"></div>
  </div>`;
      const aviso = document.getElementById('aviso-dep');
      const err = m => aviso.innerHTML = `<div class="msg err">${m}</div>`;
      document.getElementById('volver-dep').onclick = vistaDeposito;
      const itemPorId = x => items.find(i => String(i.id) === String(x));
      const actualizarItem = async (itemId, campos) => {
        const { error: e } = await sb.from('pedido_items').update(campos).eq('id', itemId);
        if (e) err(esc(e.message)); else detallePedidoDeposito(id);
      };

      /* ---- MODO EDICIÓN (hasta ENTREGADO) ---- */
      if (editando) {
        const cont = document.getElementById('ed-items'), quitados = [];
        const nuevaFila = () => {
          const d = document.createElement('div'); d.className = 'item-form-grid ed-row';
          d.innerHTML = `<input class="prod" list="lista-productos" placeholder="Buscar producto de la lista" autocomplete="off">
        <input class="cant" type="number" step="any" min="0" value="1"><button type="button" class="quitar" aria-label="Quitar">✕</button>`;
          cont.appendChild(d); bindQuitar(d);
        };
        const bindQuitar = d => d.querySelector('.quitar').onclick = () => {
          if (cont.children.length <= 1) return;
          if (d.dataset.itemId) quitados.push(d.dataset.itemId);
          d.remove();
        };
        cont.querySelectorAll('.ed-row').forEach(bindQuitar);
        document.getElementById('ed-mas').onclick = nuevaFila;
        document.getElementById('ed-cancelar').onclick = () => detallePedidoDeposito(id);
        document.getElementById('ed-guardar').onclick = async () => {
          const buscar = t => productosLista.find(x => x.nombre.toUpperCase() === t.trim().toUpperCase());
          const rows = [...cont.children].map(d => ({ id: d.dataset.itemId, texto: d.querySelector('.prod').value.trim(), cant: parseFloat(d.querySelector('.cant').value) }));
          const malos = rows.filter(r => !r.texto || !(r.cant > 0) || (!buscar(r.texto) && !(r.id && itemPorId(r.id).producto === r.texto)));
          if (malos.length) return err('Revisá los productos: cada uno tiene que estar en la lista y con cantidad mayor a 0.');
          const conSeries = quitados.map(itemPorId).filter(i => i.series && i.series.length);
          if (conSeries.length && !confirm('Vas a quitar productos que ya tienen números de serie cargados (' + conSeries.map(i => i.producto).join(', ') + '). Esas series se borran también. ¿Seguir?')) return;
          document.getElementById('ed-guardar').disabled = true;
          let fallo = null;
          for (const qid of quitados) {
            let r = await sb.from('series').delete().eq('item_id', qid); fallo = fallo || r.error;
            r = await sb.from('pedido_items').delete().eq('id', qid); fallo = fallo || r.error;
          }
          for (const r of rows) {
            const pr = buscar(r.texto);
            if (r.id) {
              const o = itemPorId(r.id); const cambioProd = o.producto !== r.texto, cambioCant = Number(o.cantidad) !== r.cant;

function actualizarPrecioFila(fila) {
  const resumen = fila.querySelector('.precio-resumen');
  if (!resumen) return;

  const nombre = fila.querySelector('.prod').value.trim().toUpperCase();
  const cantidad = Number(fila.querySelector('.cant').value);
  const clienteId = Number(selectorCliente.value);

  if (!clienteId) {
    resumen.textContent = 'Seleccioná un cliente para consultar sus precios.';
    return;
  }

  const producto = productosLista.find(
    p => p.nombre.toUpperCase() === nombre
  );

  if (!producto) {
    resumen.textContent = 'Elegí un producto de la lista.';
    return;
  }

  if (!Number.isFinite(cantidad) || cantidad <= 0) {
    resumen.textContent = 'Ingresá una cantidad válida.';
    return;
  }

  const opciones = preciosPorProducto.get(String(producto.id)) || [];

  const opcionesValidas = opciones.filter(
    op => Number.isFinite(Number(op.precio)) && Number(op.precio) > 0
  );

  if (!opcionesValidas.length) {
    resumen.textContent =
      'No hay precio válido en las listas asignadas. Podrás ingresar un precio para este pedido.';
    return;
  }

  const esEspecial = opcionesValidas.some(
    op => op.origen_precio === 'especial_permanente'
  );

  // Si todas las listas tienen el mismo precio, no hace falta elegir.
  const preciosUnicos = [...new Set(
    opcionesValidas.map(op => Number(op.precio))
  )];

  let opcionElegida = opcionesValidas[0];

  // Si los precios son distintos, permitir elegir la lista para esta fila.
  if (!esEspecial && preciosUnicos.length > 1) {
    const selectorPrecio = fila.querySelector('.precio-lista-elegida');

    const valorAnterior = selectorPrecio
      ? selectorPrecio.value
      : '';

    const opcionesHTML = opcionesValidas.map((op, i) => {
      const valor = String(i);
      const etiqueta =
        `${op.lista} — $${formatoDinero(Number(op.precio))}`;

      return `<option value="${valor}" ${valor === valorAnterior ? 'selected' : ''}>${esc(etiqueta)}</option>`;
    }).join('');

    resumen.innerHTML =
      `<div class="msg err">¡Atención! Hay listas con distintos precios. ¿Qué precio tomo?</div>
       <label>Elegí el precio para este pedido:
         <select class="precio-lista-elegida">${opcionesHTML}</select>
       </label>`;

    const selectorNuevo = resumen.querySelector('.precio-lista-elegida');

    const indice = Number(selectorNuevo.value);
    opcionElegida = opcionesValidas[
      Number.isInteger(indice) && opcionesValidas[indice]
        ? indice
        : 0
    ];

    selectorNuevo.addEventListener('change', () => {
      actualizarPrecioFila(fila);
    });
  } else {
    const etiquetaOrigen = esEspecial
      ? 'Precio especial permanente'
      : opcionesValidas[0].lista;

    resumen.innerHTML =
      `<div>${esc(etiquetaOrigen)}</div>`;
  }

  const precio = Number(opcionElegida.precio);
  const subtotal = precio * cantidad;

  const tipo = fila.querySelector('.desc-tipo').value;
  const valor = Math.max(
    0,
    Number(fila.querySelector('.desc-valor').value) || 0
  );

  let descuento = 0;

  if (tipo === 'porcentaje') {
    descuento = subtotal * Math.min(valor, 100) / 100;
  } else if (tipo === 'importe') {
    descuento = Math.min(valor, subtotal);
  }

  const total = Math.max(0, subtotal - descuento);

  resumen.insertAdjacentHTML(
    'beforeend',
    `<div>Precio unitario: $${formatoDinero(precio)} · ` +
    `Subtotal: $${formatoDinero(subtotal)} · ` +
    `Descuento: -$${formatoDinero(descuento)} · ` +
    `Total: $${formatoDinero(total)}</div>`
  );
}

      

async function cargarPreciosCliente() {
  preciosPorProducto.clear();
  mostrarAvisoClientes('');

  const clienteId = Number(selectorCliente.value);

  if (!clienteId) {
    items.querySelectorAll('.item-form-grid').forEach(actualizarPrecioFila);
    return;
  }

  const cliente = clientesActivos.find(
    c => Number(c.id) === clienteId
  );

  if (!cliente) {
  mostrarAvisoClientes(
    '<div class="msg err">No se encontró el cliente seleccionado.</div>'
  );
  return false;
}

  // Consultar listas adicionales y combinar con la principal.
  const { data: asignaciones, error: errorAsignaciones } = await sb
    .from('clientes_listas_precios')
    .select('lista_precios_id')
    .eq('cliente_id', clienteId);

 if (errorAsignaciones) {
  mostrarAvisoClientes(
    `<div class="msg err">No se pudieron consultar las listas: ${esc(errorAsignaciones.message)}</div>`
  );
  return false;
}

  const listaIds = [...new Set([
    Number(cliente.lista_precios_id),
    ...(asignaciones || []).map(x => Number(x.lista_precios_id))
  ].filter(Number.isInteger).filter(id => id > 0))];

  if (!listaIds.length) {
    mostrarAvisoClientes(
      '<div class="msg">Este cliente no tiene listas de precios asignadas.</div>'
    );
    items.querySelectorAll('.item-form-grid').forEach(actualizarPrecioFila);
    return;
  }

  const [
    { data: listas, error: errorListas },
    { data: precios, error: errorPrecios },
    { data: especiales, error: errorEspeciales }
  ] = await Promise.all([
    sb.from('listas_precios')
      .select('id,nombre')
      .in('id', listaIds)
      .eq('activo', true),

    sb.from('lista_precios_items')
      .select('lista_precio_id,producto_id,precio')
      .in('lista_precio_id', listaIds),

    sb.from('precios_especiales_clientes')
      .select('producto_id,precio')
      .eq('cliente_id', clienteId)
      .eq('activo', true)
  ]);

  if (errorListas || errorPrecios || errorEspeciales) {
    const error = errorListas || errorPrecios || errorEspeciales;
    mostrarAvisoClientes(
      `<div class="msg err">No se pudieron cargar todos los precios: ${esc(error.message)}</div>`
    );
    return false;
  }

  const nombresListas = new Map(
    (listas || []).map(l => [Number(l.id), l.nombre])
  );

  const mapa = new Map();

  (precios || []).forEach(p => {
    const precio = Number(p.precio);
    if (!Number.isFinite(precio) || precio <= 0) return;

    const productoId = String(p.producto_id);
    if (!mapa.has(productoId)) mapa.set(productoId, []);

    mapa.get(productoId).push({
      lista_precio_id: Number(p.lista_precio_id),
      lista: nombresListas.get(Number(p.lista_precio_id)) || 'Lista',
      precio,
      origen_precio: 'lista'
    });
  });

  const mapaEspeciales = new Map(
    (especiales || [])
      .filter(p => Number.isFinite(Number(p.precio)) && Number(p.precio) > 0)
      .map(p => [String(p.producto_id), Number(p.precio)])
  );

  productosLista.forEach(producto => {
    const id = String(producto.id);

    if (mapaEspeciales.has(id)) {
      mapa.set(id, [{
        lista_precio_id: Number(cliente.lista_precios_id),
        lista: 'Precio especial permanente',
        precio: mapaEspeciales.get(id),
        origen_precio: 'especial_permanente'
      }]);
      return;
    }

    const opciones = mapa.get(id) || [];

    // Eliminar duplicados con el mismo importe.
    const unicos = [];
    opciones.forEach(opcion => {
      if (!unicos.some(x => x.precio === opcion.precio)) {
        unicos.push(opcion);
      }
    });

    mapa.set(id, unicos);
  });

  mapa.forEach((opciones, productoId) => {
    preciosPorProducto.set(productoId, opciones);
  });

  items.querySelectorAll('.item-form-grid').forEach(actualizarPrecioFila);
  return true;
}

  const { data: catalogo, error: errorCatalogo } = await sb

 if (estado === 'entregado') {

       <b>Entrega:</b> ${MODAL[p.modalidad]}<br>
       <b>Fecha de entrega:</b> ${fmtFecha(p.fecha_entrega)}<br>
       <b>Creado:</b> ${fmtFechaHora(p.creado_en)}${p.fecha_listo ? `<br><b>Listo:</b> ${fmtFechaHora(p.fecha_listo)}` : ''}
       ${p.fecha_entregado ? `<br><b>Entregado:</b> ${fmtFechaHora(p.fecha_entregado)}` : ''}</p>
    <table><thead><tr><th>Producto</th><th class="num">Cantidad</th></tr></thead><tbody>${filas}</tbody></table>
    ${p.comentarios ? `<p><b>Comentarios:</b> ${esc(p.comentarios)}</p>` : ''}
${p.nota_deposito ? `<p><b>Observaciones de entrega:</b> ${esc(p.nota_deposito)}</p>` : ''}
${p.enargas_transferido !== null ? `<p><b>Series transferidas en ENARGAS:</b> ${p.enargas_transferido ? 'Sí' : 'No'}</p>` : ''}
  </div>`;
      document.getElementById('volver').onclick = volver;
      document.getElementById('imprimir').onclick = () =>
        opcionesImpresionPedido(p);
      const btnCompletarPrecios =
        document.getElementById('completar-precios');

      if (btnCompletarPrecios) {
        btnCompletarPrecios.onclick = () =>
          completarPreciosPedido(id, volver);
      }
      const btnEditarNota = document.getElementById('editar-nota-deposito');

      if (btnEditarNota) {
        btnEditarNota.onclick = async () => {
          const nota = prompt(
            'Observaciones de entrega (por ejemplo: 3 bultos):',
            p.nota_deposito || ''
          );

          // Si se pulsa Cancelar, no se modifica nada.
          if (nota === null) return;

          const { error } = await sb
            .from('pedidos')
            .update({
              nota_deposito: nota.trim() || null
            })
            .eq('id', p.id);

          if (error) {
            alert('No se pudieron guardar las observaciones: ' + error.message);
            return;
          }

          alert('Observaciones guardadas correctamente.');
          await detallePedido(p.id, volver);
        };
      }
      const a = document.getElementById('anular');
      if (a) a.onclick = async () => {
        if (!confirm(`¿Anular el presupuesto ${fmtRemito(p.numero_remito)}? No se puede deshacer.`)) return;
        const { error } = await sb.from('pedidos').update({ estado: 'anulado' }).eq('id', p.id);
        if (error) alert('No se pudo anular: ' + error.message); else detallePedido(p.id, volver);
      };
    }

    /* ---------- ADMIN: USUARIOS (funcional) ---------- */
    async function vistaUsuarios() {
      if (perfil?.rol !== 'admin') {
        return alert('No tenés permiso para administrar usuarios.');
      }
      const cont = document.getElementById('contenido');
      cont.innerHTML = `<div class="panel"><h2>Usuarios</h2><div id="lista" class="vacio">Cargando…</div></div>`;
      const { data, error } = await sb.from('profiles').select('*').order('creado_en', { ascending: false });
      const lista = document.getElementById('lista');
      if (error) return lista.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
      lista.className = '';
      lista.innerHTML = data.map(u => `
    <div class="fila">
      <div class="dato"><b>${esc(u.nombre)}</b>
        <small>${u.rol === 'pendiente' ? `<span class="etiqueta pendiente">Pidió: ${esc(ROLES[u.puesto_solicitado] || '—')}</span>` : ''}</small></div>
      <select data-id="${u.id}" data-campo="rol" aria-label="Puesto de ${esc(u.nombre)}" ${u.id === perfil.id ? 'disabled' : ''}>
        ${Object.entries(ROLES).map(([k, n]) => `<option value="${k}" ${u.rol === k ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
      <select data-id="${u.id}" data-campo="activo" aria-label="Estado de ${esc(u.nombre)}" ${u.id === perfil.id ? 'disabled' : ''}>
        <option value="true" ${u.activo ? 'selected' : ''}>Activo</option>
        <option value="false" ${!u.activo ? 'selected' : ''}>Desactivado</option>
      </select>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <input
          type="email"
          data-email-id="${u.id}"
          placeholder="Nuevo correo electrónico"
          aria-label="Nuevo correo de ${esc(u.nombre)}"
        >
        <button
          type="button"
          data-cambiar-email="${u.id}"
          ${u.id === perfil.id ? 'disabled' : ''}
        >
          Cambiar email
        </button>
      </div>
    </div>`).join('') || '<p class="vacio">Todavía no hay usuarios.</p>';
      lista.querySelectorAll('select').forEach(s => s.onchange = async () => {
        const id = s.dataset.id;
        const campo = s.dataset.campo;
        const valor = campo === 'activo' ? s.value === 'true' : s.value;

        const usuario = data.find(u => u.id === id);
        if (!usuario) return;

        let cambios = { [campo]: valor };

        // Al asignar un rol operativo a un usuario pendiente,
        // activar su cuenta automáticamente.
        if (
          campo === 'rol' &&
          usuario.rol === 'pendiente' &&
          ['ventas', 'deposito', 'supervisor', 'admin'].includes(valor)
        ) {
          cambios.activo = true;
        }

        const { error } = await sb
          .from('profiles')
          .update(cambios)
          .eq('id', id);

        if (error) {
          alert('No se pudo guardar: ' + error.message);
        }

        await vistaUsuarios();
      });
      lista.querySelectorAll('[data-cambiar-email]').forEach(b => {
        b.onclick = async () => {
          const userId = b.dataset.cambiarEmail;
          const input = lista.querySelector(
            `[data-email-id="${userId}"]`
          );
          const newEmail = input?.value.trim().toLowerCase();

          if (!newEmail) {
            alert('Escribí el nuevo correo electrónico.');
            return;
          }

          if (!confirm(
            'Vas a cambiar el correo a ' + newEmail +
            '. El cambio se aplicará sin pedir confirmación al correo nuevo. ¿Continuar?'
          )) {
            return;
          }

          b.disabled = true;

          try {
            const { data, error } = await sb.functions.invoke(
              'cambiar-email-usuario',
              {
                body: {
                  userId: userId,
                  newEmail: newEmail
                }
              }
            );

            if (error) {
              let mensaje = error.message;

              if (error.context &&
                typeof error.context.json === 'function') {
                try {
                  const detalle = await error.context.json();
                  if (detalle && detalle.error) {
                    mensaje = detalle.error;
                  }
                } catch (_) { }
              }

              alert('No se pudo cambiar el correo: ' + mensaje);
              return;
            }

            if (!data || data.ok !== true) {
              alert(
                data?.error ||
                'No se pudo confirmar el cambio del correo.'
              );
              return;
            }

            alert('Correo actualizado correctamente: ' + data.email);
            await vistaUsuarios();

          } catch (error) {
            alert(
              'Error al conectar con Supabase: ' + error.message
            );
          } finally {
            b.disabled = false;
          }
        };
      });
    }

    /* ---------- ARRANQUE ---------- */
    sb.auth.onAuthStateChange((evento, sesion) => {
      if (sesion) setTimeout(cargarPerfil, 0); else { perfil = null; pantallaLogin(); }
    });
    sb.auth.getSession().then(({ data: { session } }) => { if (!session) pantallaLogin(); });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
          console.log("SGV: service worker registrado");
        } catch (error) {
          console.error("SGV: error al registrar service worker", error);
        }
      });
    }
  </script>
</body>

</html>
