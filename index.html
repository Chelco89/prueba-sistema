    function sgvBase64UrlToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");
      const rawData = atob(base64);
      return Uint8Array.from(rawData, c => c.charCodeAt(0));
    }

    async function activarNotificaciones() {
      try {
        if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
          alert("Este navegador no admite notificaciones push.");
          return;
        }

        if (!("Notification" in window)) {
          alert("Este navegador no admite notificaciones.");
          return;
        }

        if (!perfil || !perfil.id) {
          alert("Primero tenés que iniciar sesión.");
          return;
        }

        const permiso = await Notification.requestPermission();

        if (permiso !== "granted") {
          alert("No se concedió permiso para las notificaciones.");
          return;
        }

        const registro = await navigator.serviceWorker.ready;
        let suscripcion = await registro.pushManager.getSubscription();

        if (!suscripcion) {
          suscripcion = await registro.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: sgvBase64UrlToUint8Array(
              SGV_VAPID_PUBLIC_KEY
            )
          });
        }

        const { error } = await sb
          .from("push_subscriptions")
          .upsert(
            {
              user_id: perfil.id,
              subscription: suscripcion.toJSON()
            },
            { onConflict: "user_id,subscription" }
          );

        if (error) throw error;

        alert("¡Notificaciones activadas en este dispositivo!");
      } catch (error) {
        console.error("Error al activar notificaciones:", error);
        alert("No se pudieron activar las notificaciones. Revisá la consola para ver el error.");
      }
    }
    let escanerStock = null;

async function escanearCodigoStock(callback) {
  if (typeof Html5Qrcode === 'undefined') {
    alert('No se pudo cargar el lector de códigos.');
    return;
  }

  const modal = document.createElement('div');

  modal.id = 'stock-escaner-modal';
  modal.style.cssText = `
    position:fixed;

  modal.innerHTML = `

    ">
      <h3>Escanear código</h3>

      <p id="stock-escaner-aviso" class="vacio">
        Apuntá la cámara al código.

      <button
        type="button"
        class="btn sec"
        id="stock-escaner-cerrar">
        Cerrar cámara
      </button>
    </div>
  `;

  document.body.appendChild(modal);

  const cerrar = async () => {
    if (escanerStock) {
      try {
        if (escanerStock.isScanning) {
          await escanerStock.stop();
        }
        await escanerStock.clear();
      } catch (error) {
        console.warn('Error al cerrar escáner:', error);
      }

      escanerStock = null;
    }

    modal.remove();
  };

  modal.querySelector('#stock-escaner-cerrar').onclick = cerrar;

  try {
    escanerStock = new Html5Qrcode('stock-escaner-camara');

    const camaras = await Html5Qrcode.getCameras();

    if (!camaras.length) {
      throw new Error('No se encontró ninguna cámara.');
    }

    const camaraTrasera =
      camaras.find(c =>
        /back|rear|environment|trasera|posterior/i.test(c.label)
      ) || camaras[camaras.length - 1];

    await escanerStock.start(
      camaraTrasera.id,
      {
        fps: 10,
        qrbox: { width: 250, height: 150 }
      },
      async codigo => {
        const valor = codigo.trim().toUpperCase();

        if (!valor) return;

        await cerrar();
        callback(valor);
      },
      () => {}
    );

  } catch (error) {
    modal.querySelector('#stock-escaner-aviso').innerHTML =
      `<span style="color:red">${esc(error.message || 'No se pudo iniciar la cámara.')}</span>`;
  }

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ROLES = {
      admin: 'Administrador',

    };
    let perfil = null, vista = null;
    let filtros = { numero: '', cliente: '', estado: '', listo: '', entrega: '' };
    // Estado de navegación para recuperar la pantalla después de una recarga
let pedidoDepositoActivo = null;
let pedidoDepositoEditando = false;
let cajaPanelActivo = null;
let cuentaCorrienteActiva = null;
let stockTabActiva = 'ingreso';
let stockScroll = 0;

function guardarEstadoNavegacion() {
  try {
    sessionStorage.setItem('sgv_estado_navegacion', JSON.stringify({
      vista,
      depTab,
      filtros,
      pedidoDepositoActivo,
            pedidoDepositoEditando,
     cajaPanelActivo,
cuentaCorrienteActiva,
stockTabActiva,
stockScroll: window.scrollY
    }));
  } catch (error) {
    console.warn('No se pudo guardar el estado de navegación:', error);
  }
}

function recuperarEstadoNavegacion() {
  try {
    const guardado = sessionStorage.getItem('sgv_estado_navegacion');
    if (!guardado) return;

    const estado = JSON.parse(guardado);

    if (estado && typeof estado === 'object') {
      vista = estado.vista || null;
      depTab = estado.depTab || 'pendiente';

      if (estado.filtros && typeof estado.filtros === 'object') {
        filtros = { ...filtros, ...estado.filtros };
      }

      pedidoDepositoActivo = estado.pedidoDepositoActivo || null;
      pedidoDepositoEditando = estado.pedidoDepositoEditando === true;
      cajaPanelActivo = estado.cajaPanelActivo || null;
      cuentaCorrienteActiva = estado.cuentaCorrienteActiva || null;
      stockTabActiva = estado.stockTabActiva || 'ingreso';
stockScroll = Number(estado.stockScroll) || 0;
    }
  } catch (error) {
    console.warn('No se pudo recuperar el estado de navegación:', error);
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    guardarEstadoNavegacion();
  } else {
    requestAnimationFrame(() => {
      window.scrollTo(0, stockScroll);
    });
  }
});

window.addEventListener('pagehide', () => {
  guardarEstadoNavegacion();
});

      ${nuevo ? `<label for="nombre">Nombre</label><input id="nombre" required autocomplete="name">
      <label for="puesto">Puesto</label>
      <select id="puesto"><option value="ventas">Ventas</option><option value="deposito">Depósito</option></select>` : ''}
      <label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="email">
      <label for="pass">Contraseña</label><input id="pass" type="password" required minlength="6" autocomplete="${nuevo ? 'new-password' : 'current-password'}">

      document.getElementById('f').onsubmit = async e => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('pass').value;
        let r;
        if (nuevo) {
          r = await sb.auth.signUp({
            email, password, options: {
              data: {
                nombre: document.getElementById('nombre').value.trim(),
                puesto: document.getElementById('puesto').value
              }
            }
          });
          if (!r.error && !r.data.session) {
            return pantallaLogin('entrar', {
              tipo: 'ok',
              texto: 'Registro recibido. Si te llegó el correo de confirmación, confirmalo primero. Después, tu cuenta quedará pendiente de aprobación del administrador antes de poder ingresar.'
            });
          }
        } else {
          r = await sb.auth.signInWithPassword({ email, password });
        }
        if (r.error) document.getElementById('aviso').innerHTML = `<div class="msg err">${esc(traducir(r.error.message))}</div>`;
      };
    }
    function traducir(m) {
      if (/Invalid login/i.test(m)) {
        return 'No se pudo iniciar sesión. Revisá el correo y la contraseña. Si acabás de registrarte, confirmá primero tu correo.';
      }
      if (/already registered/i.test(m)) {
        return 'Ese correo ya tiene un usuario creado. Probá iniciar sesión.';
      }
      if (/Email not confirmed/i.test(m)) {
        return 'Primero confirmá tu correo con el mensaje que te llegó.';
      }
      return m;
    }

    /* ---------- LISTAS DE PRECIOS ---------- */
    async function vistaListasPrecios() {
      const c = document.getElementById('contenido');

      c.innerHTML = `
    <div class="panel">
      <div class="barra">
        <h2>Listas de Precios</h2>
      </div>

      <p class="vacio" style="padding-top:0">
        Creá listas para distintos clientes. La lista General se conserva
        como predeterminada.
      </p>

      <form id="form-lista-precio" class="fila"
        style="border:0;padding-top:0;align-items:flex-end">
        <div class="dato">
          <label for="nombre-lista">Nombre de la lista</label>
          <input id="nombre-lista"
            placeholder="Ej.: Mayorista, Distribuidores"
            required maxlength="100">
        </div>
        <button class="btn chico" type="submit">
          Crear lista
        </button>
      </form>

      <div id="aviso-listas"></div>
      <h3>Listas existentes</h3>
      <div id="res-listas" class="vacio">Cargando...</div>
    </div>
  `;

      const form = document.getElementById('form-lista-precio');
      const aviso = document.getElementById('aviso-listas');
      const resultado = document.getElementById('res-listas');

      async function cargarListas() {
        resultado.innerHTML = 'Cargando...';

        const { data, error } = await sb
          .from('listas_precios')
          .select('id,nombre,es_general,activo,creado_en')
          .order('es_general', { ascending: false })
          .order('nombre');

        if (error) {
          resultado.innerHTML =
            `<div class="msg err">${esc(error.message)}</div>`;
          return;
        }

        resultado.className = '';

        resultado.innerHTML = data.length
          ? data.map(lista => `
          <div class="fila">
            <div class="dato">
              <b>${esc(lista.nombre)}</b>
              ${lista.es_general
              ? '<span class="badge-s-u">GENERAL</span>'
              : ''}
              <small>${lista.activo ? 'Activa' : 'Inactiva'}</small>
            </div>
            <button
  type="button"
  class="btn chico lp-nombre"
  data-id="${lista.id}"
  data-nombre="${esc(lista.nombre)}">
  Editar nombre
</button>

<button
  type="button"
  class="btn chico lp-precios"
  data-id="${lista.id}"
  data-nombre="${esc(lista.nombre)}">
  Editar precios
</button>
            <button
              type="button"
              class="btn chico sec lp-toggle"
              data-id="${lista.id}"
              data-activo="${lista.activo}"
              ${lista.es_general ? 'disabled title="La lista General no se puede desactivar"' : ''}
            >
              ${lista.activo ? 'Desactivar' : 'Activar'}
            </button>
          </div>
        `).join('')
          : '<p class="vacio">Todavía no hay listas cargadas.</p>';

        resultado.querySelectorAll('.lp-toggle').forEach(b => {
          b.onclick = async () => {
            const nuevoEstado = b.dataset.activo !== 'true';
            b.disabled = true;

            const { error: errorCambio } = await sb
              .from('listas_precios')
              .update({ activo: nuevoEstado })
              .eq('id', b.dataset.id);

            if (errorCambio) {
              alert('No se pudo actualizar la lista: ' + errorCambio.message);
              b.disabled = false;
              return;
            }

            await cargarListas();
          };
        });

        resultado.querySelectorAll('.lp-precios').forEach(b => {
          b.onclick = () => editarPreciosLista(
            b.dataset.id,
            b.dataset.nombre
          );
        });
        resultado.querySelectorAll('.lp-nombre').forEach(b => {
          b.onclick = async () => {
            const nombreActual = b.dataset.nombre;
            const nuevoNombre = prompt(
              'Ingresá el nuevo nombre de la lista:',
              nombreActual
            );

            if (nuevoNombre === null) return;

            const nombre = nuevoNombre.trim().replace(/\s+/g, ' ');

            if (!nombre) {
              alert('El nombre no puede estar vacío.');
              return;
            }

            if (nombre === nombreActual) return;

            b.disabled = true;

            try {
              const { error } = await sb
                .from('listas_precios')
                .update({ nombre })
                .eq('id', b.dataset.id);

              if (error) {
                alert(
                  error.code === '23505'
                    ? 'Ya existe una lista con ese nombre.'
                    : 'No se pudo cambiar el nombre: ' + error.message
                );
                return;
              }

              await cargarListas();
              alert('Nombre actualizado correctamente.');
            } finally {
              if (b.isConnected) b.disabled = false;
            }
          };
        });
      }

      form.onsubmit = async e => {
        e.preventDefault();

        const input = document.getElementById('nombre-lista');
        const nombre = input.value.trim().replace(/\s+/g, ' ');
        const boton = form.querySelector('[type="submit"]');

        if (!nombre) return;

        boton.disabled = true;
        aviso.innerHTML = '';

        try {
          const { error } = await sb
            .from('listas_precios')
            .insert({
              nombre,
              es_general: false,
              activo: true,
              creado_por: perfil.id
            });

          if (error) {
            aviso.innerHTML = `
          <div class="msg err">
            ${error.code === '23505'
                ? 'Ya existe una lista con ese nombre.'
                : esc(error.message)}
          </div>`;
            return;
          }

          form.reset();
          aviso.innerHTML =
            '<div class="msg ok">Lista creada correctamente.</div>';

          await cargarListas();

        } finally {
          boton.disabled = false;
        }
      };

      await cargarListas();
    }

    /* ---------- EDITAR PRECIOS DE UNA LISTA ---------- */
    async function editarPreciosLista(id, nombre) {
      const c = document.getElementById('contenido');

      c.innerHTML = `
    <div class="panel">
      <div class="barra">
        <h2>Precios: ${esc(nombre)}</h2>
        <button type="button" class="btn sec chico" id="lp-volver">
          ← Volver
        </button>
      </div>

      <p class="vacio" style="padding-top:0">
        Agregá o modificá los precios de esta lista.
        Para quitar un producto, usá el botón correspondiente.
        Los cambios no modificarán otras listas ni los precios
        guardados en pedidos anteriores.
      </p>

      <div id="lp-precios-aviso"></div>
      <div id="lp-precios-cargando" class="vacio">
        Cargando productos...
      </div>

      <form id="lp-precios-form" hidden>
        <div id="lp-precios-listado"></div>
        <button class="btn" type="submit" id="lp-precios-guardar">
          Guardar precios
        </button>
      </form>
    </div>
  `;

      document.getElementById('lp-volver').onclick = vistaListasPrecios;

      const aviso = document.getElementById('lp-precios-aviso');
      const cargando = document.getElementById('lp-precios-cargando');
      const formulario = document.getElementById('lp-precios-form');
      const listado = document.getElementById('lp-precios-listado');

      const { data: productos, error: errorProductos } = await sb
        .from('productos')
        .select('id,nombre,activo')
        .eq('activo', true)
        .order('nombre');

      if (errorProductos) {
        cargando.textContent = '';
        aviso.innerHTML =
          `<div class="msg err">${esc(errorProductos.message)}</div>`;
        return;
      }

      const { data: precios, error: errorPrecios } = await sb
        .from('lista_precios_items')
        .select('producto_id,precio')
        .eq('lista_precio_id', Number(id));

      if (errorPrecios) {
        cargando.textContent = '';
        aviso.innerHTML =
          `<div class="msg err">${esc(errorPrecios.message)}</div>`;
        return;
      }

      const preciosPorProducto = new Map(
        (precios || []).map(p => [
          String(p.producto_id),
          p.precio
        ])
      );

      listado.innerHTML = productos.length
        ? productos.map(p => {
          const clave = String(p.id);
          const incluido = preciosPorProducto.has(clave);
          const actual = preciosPorProducto.get(clave);

          return `
          <div class="fila">
            <div class="dato">
              <b>${esc(p.nombre)}</b>
              <small>
                ${incluido ? 'Incluido en esta lista' : 'No incluido'}
              </small>
            </div>

            <div class="dato">
              <label for="lp-precio-${p.id}">Precio ($)</label>
              <input
                id="lp-precio-${p.id}"
                class="lp-precio-input"
                data-producto-id="${p.id}"
                type="number"
                min="0"
                step="0.01"
                value="${incluido ? actual : ''}"
                data-original="${incluido ? actual : ''}"
                placeholder="Sin precio cargado"
              >
            </div>

            ${incluido
              ? `<button
                    type="button"
                    class="btn sec chico lp-quitar"
                    data-producto-id="${p.id}"
                    data-producto-nombre="${esc(p.nombre)}">
                    Quitar de esta lista
                  </button>`
              : ''
            }
          </div>
        `;
        }).join('')
        : '<p class="vacio">No hay productos activos.</p>';

      cargando.textContent = '';
      formulario.hidden = false;

      listado.querySelectorAll('.lp-quitar').forEach(b => {
        b.onclick = async () => {
          const productoId = Number(b.dataset.productoId);
          const productoNombre = b.dataset.productoNombre;

          const hayCambiosSinGuardar = [
            ...listado.querySelectorAll('.lp-precio-input')
          ].some(input => {
            const original = input.dataset.original ?? '';
            const actual = input.value.trim();

            if (original === '') return actual !== '';
            if (actual === '') return true;

            return (
              Number.isFinite(Number(actual)) &&
              Number(actual) !== Number(original)
            );
          });

          if (hayCambiosSinGuardar) {
            alert(
              'Hay precios modificados sin guardar. ' +
              'Guardá los cambios antes de quitar un producto de la lista.'
            );
            return;
          }

          if (!confirm(
            `¿Quitar "${productoNombre}" de la lista "${nombre}"?\n\n` +
            'No se eliminará del catálogo ni de las otras listas. ' +
            'Los pedidos anteriores conservarán sus precios.'
          )) {
            return;
          }

          b.disabled = true;

          try {
            const { error } = await sb
              .from('lista_precios_items')
              .delete()
              .eq('lista_precio_id', Number(id))
              .eq('producto_id', productoId);

            if (error) {
              aviso.innerHTML =
                `<div class="msg err">${esc(error.message)}</div>`;
              return;
            }

            aviso.innerHTML =
              '<div class="msg ok">Producto quitado de esta lista.</div>';

            await editarPreciosLista(id, nombre);
          } finally {
            if (b.isConnected) b.disabled = false;
          }
        };
      });

      formulario.onsubmit = async e => {
        e.preventDefault();
        aviso.innerHTML = '';

        const entradas = [
          ...listado.querySelectorAll('.lp-precio-input')
        ].filter(input => input.value.trim() !== '');

        if (!entradas.length) {
          aviso.innerHTML =
            '<div class="msg">Ingresá al menos un precio.</div>';
          return;
        }

        const invalidos = entradas.filter(input =>
          !Number.isFinite(Number(input.value)) ||
          Number(input.value) < 0
        );

        if (invalidos.length) {
          aviso.innerHTML =
            '<div class="msg err">Revisá los precios ingresados.</div>';
          return;
        }

        const filas = entradas.map(input => ({
          lista_precio_id: Number(id),
          producto_id: Number(input.dataset.productoId),
          precio: Number(input.value),
          actualizado_por: perfil.id
        }));

        const boton = document.getElementById('lp-precios-guardar');
        boton.disabled = true;

        try {
          const { error } = await sb
            .from('lista_precios_items')
            .upsert(filas, {
              onConflict: 'lista_precio_id,producto_id'
            });

          if (error) {
            aviso.innerHTML =
              `<div class="msg err">${esc(error.message)}</div>`;
            return;
          }

          aviso.innerHTML =
            '<div class="msg ok">Precios guardados correctamente.</div>';

          await editarPreciosLista(id, nombre);
        } finally {
          if (boton.isConnected) boton.disabled = false;
        }
      };
    }

async function verPresupuestoCuentaCorriente(pedidoId, cuentaId) {
  const c = document.getElementById('contenido');
  c.innerHTML = '<div class="panel">Cargando presupuesto…</div>';

  const { data: p, error: errorPedido } = await sb
    .from('pedidos')
    .select('*')
    .eq('id', pedidoId)
    .maybeSingle();

  if (errorPedido || !p) {
    c.innerHTML = `<div class="panel">
      <button class="btn chico" id="cc-presupuesto-volver">
        ← Volver a Cuenta Corriente
      </button>
      <p>No se pudo cargar el presupuesto.</p>
      ${esc(errorPedido?.message || '')}
    </div>`;
    document.getElementById('cc-presupuesto-volver').onclick =
      () => verCuentaCorriente(cuentaId);
    return;
  }

  const { data: items, error: errorItems } = await sb
    .from('pedido_items')
    .select('*')
    .eq('pedido_id', pedidoId)
    .order('id');

  if (errorItems) {
    c.innerHTML = `<div class="panel">
      <button class="btn chico" id="cc-presupuesto-volver">
        ← Volver a Cuenta Corriente
      </button>
      <p>No se pudieron cargar los productos.</p>
      ${esc(errorItems.message)}
    </div>`;
    document.getElementById('cc-presupuesto-volver').onclick =
      () => verCuentaCorriente(cuentaId);
    return;
  }

  const itemsPrincipales = (items || []).filter(i => !i.padre_item_id);
  const idsItems = itemsPrincipales.map(i => i.id);

  let precios = [];

  if (idsItems.length) {
    const { data, error } = await sb
      .from('pedido_item_precios')
      .select('*')
      .in('pedido_item_id', idsItems);

    if (error) {
      c.innerHTML = `<div class="panel">
        <button class="btn chico" id="cc-presupuesto-volver">
          ← Volver a Cuenta Corriente
        </button>
        <p>No se pudieron cargar los precios históricos.</p>
        ${esc(error.message)}
      </div>`;
      document.getElementById('cc-presupuesto-volver').onclick =
        () => verCuentaCorriente(cuentaId);
      return;
    }

    precios = data || [];
  }

  const dinero = valor => Number(valor || 0).toLocaleString('es-AR', {
    style: 'currency',
    currency: 'ARS'
  });

  const preciosPorItem = {};
  precios.forEach(precio => {
    preciosPorItem[String(precio.pedido_item_id)] = precio;
  });

  let total = 0;
  let hayPreciosPendientes = false;

  const filas = itemsPrincipales.map(item => {
    const precio = preciosPorItem[String(item.id)];
    const cantidad = Number(item.cantidad || 0);

    if (!precio || precio.total_linea == null) {
      hayPreciosPendientes = true;

      return `
        <tr>
          <td>${esc(item.producto || 'Producto')}</td>
          <td class="num">${cantidad.toLocaleString('es-AR')}</td>
          <td class="num">Sin precio registrado</td>
          <td class="num">Pendiente</td>
        </tr>
      `;
    }

    const precioUnitario = Number(precio.precio_unitario || 0);
    const totalLinea = Number(precio.total_linea);
    total += totalLinea;

    const componentes = (items || []).filter(
      hijo => String(hijo.padre_item_id) === String(item.id)
    );

    return `
      <tr>
        <td>
          <strong>${esc(item.producto || 'Producto')}</strong>
          ${componentes.length ? `
            <div class="vacio" style="margin-top:4px">
              Componentes del kit:
              ${componentes.map(hijo =>
                esc(hijo.producto || 'Componente') +
                ' × ' +
                Number(hijo.cantidad || 0).toLocaleString('es-AR')
              ).join(' · ')}
            </div>
          ` : ''}
        </td>
        <td class="num">${cantidad.toLocaleString('es-AR')}</td>
        <td class="num">${dinero(precioUnitario)}</td>
        <td class="num">${dinero(totalLinea)}</td>
      </tr>
    `;
  }).join('');

  c.innerHTML = `
    <div class="panel">
      <button class="btn chico" id="cc-presupuesto-volver">
        ← Volver a Cuenta Corriente
      </button>

      <h2>Presupuesto ${esc(fmtRemito(p.numero_remito))}</h2>

      <p><strong>Cliente:</strong> ${esc(p.cliente || '—')}</p>
      <p><strong>Estado:</strong> ${esc(p.estado || '—')}</p>
      <p><strong>Fecha de creación:</strong>
        ${p.creado_en
          ? esc(new Date(p.creado_en).toLocaleString('es-AR'))
          : '—'}
      </p>
      <p><strong>Fecha de entrega:</strong>
        ${p.fecha_entrega
          ? esc(new Date(p.fecha_entrega + 'T12:00:00').toLocaleDateString('es-AR'))
          : '—'}
      </p>

      ${p.comentarios
        ? `<p><strong>Observaciones:</strong> ${esc(p.comentarios)}</p>`
        : ''}

      <h3>Detalle de productos</h3>

      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th class="num">Cantidad</th>
              <th class="num">Precio unitario</th>
              <th class="num">Total</th>
            </tr>
          </thead>
          <tbody>
            ${filas || '<tr><td colspan="4">El presupuesto no tiene productos.</td></tr>'}
          </tbody>
          <tfoot>
            <tr>
              <th colspan="3" class="num">Total registrado</th>
              <th class="num">${dinero(total)}</th>
            </tr>
          </tfoot>
        </table>
      </div>

      ${hayPreciosPendientes ? `
        <p class="vacio">
          Atención: hay productos sin precio histórico registrado.
          El total mostrado es parcial y no incluye esos productos.
        </p>
      ` : ''}
    </div>
  `;

  document.getElementById('cc-presupuesto-volver').onclick =
    () => verCuentaCorriente(cuentaId);
}

async function verificarDuplicadoValorInicial() {
  const aviso = document.getElementById('caja-inicial-duplicado');
  const tipo = tipoInicial.value;
  const banco = document.getElementById('caja-inicial-banco').value.trim().toLowerCase();
  const cuit = document.getElementById('caja-inicial-cuit').value.replace(/\D/g, '');
  const numero = numeroInicial.value.trim().toLowerCase();
  const identificador = identificadorInicial.value.trim().toLowerCase();

  aviso.innerHTML = '';

  const identificadorIngresado = tipo === 'cheque' ? numero : identificador;

  if (!banco || !identificadorIngresado) return;

  aviso.textContent = 'Verificando posibles duplicados…';

  const { data: iniciales, error: errorIniciales } = await sb
    .from('caja_valores_iniciales')
    .select('id,medio_pago,banco,numero_cheque,identificador_echeq,cuit_titular')
    .eq('medio_pago', tipo);

  if (errorIniciales) {
    aviso.textContent = 'No se pudo verificar si existen duplicados.';
    return;
  }

  const { data: registrados, error: errorRegistrados } = await sb
    .from('caja_cobro_valores')
    .select('id,medio_pago,banco,numero_cheque,identificador_echeq,cuit_titular')
    .eq('medio_pago', tipo);

  if (errorRegistrados) {
    aviso.textContent = 'No se pudo completar la verificación de duplicados.';
    return;
  }

  const coincide = v => {
    const mismoBanco =
      (v.banco || '').trim().toLowerCase() === banco;

    if (!mismoBanco) return false;

    if (tipo === 'cheque') {
      const mismoNumero =
        (v.numero_cheque || '').trim().toLowerCase() === numero;

      const cuitExistente = (v.cuit_titular || '').replace(/\D/g, '');

      return mismoNumero && (!cuit || !cuitExistente || cuit === cuitExistente);
    }

    return (v.identificador_echeq || '').trim().toLowerCase() === identificador;
  };

  const encontrados = [
    ...(iniciales || []),
    ...(registrados || [])
  ].filter(coincide);

  if (encontrados.length) {
    aviso.innerHTML = `
      <div class="msg err">
        Atención: encontramos ${encontrados.length} posible(s) duplicado(s)
        con el mismo banco e identificador. Revisá los datos antes de guardar.
        La carga no está bloqueada.
      </div>
    `;
  } else {
    aviso.innerHTML = `
      <div class="msg ok">No encontramos coincidencias con esos datos.</div>
    `;
  }
}

async function cargarLibroCaja(moneda) {
  const esUSD = moneda === 'USD';
  const filasId = esUSD ? 'caja-usd-filas' : 'caja-efectivo-filas';
  const totalId = esUSD ? 'caja-usd-total' : 'caja-efectivo-total';

  const filas = document.getElementById(filasId);
  const total = document.getElementById(totalId);

  if (!filas || !total) return;

  filas.innerHTML = '<tr><td colspan="5">Cargando movimientos...</td></tr>';
  total.textContent = '';

  const { data, error } = await sb
    .from('caja_movimientos')
    .select('id, fecha, tipo, moneda, importe, medio_pago, descripcion, observaciones')
    .eq('moneda', moneda)
    .order('fecha', { ascending: true })
    .order('id', { ascending: true });

  if (error) {
    filas.innerHTML = `<tr><td colspan="5">No se pudieron cargar los movimientos: ${esc(error.message)}</td></tr>`;
    return;
  }

  const movimientos = (data || []).filter(m =>
    m.tipo === 'saldo_inicial' ||
    (m.tipo === 'cobro' && (moneda === 'USD' || m.medio_pago === 'efectivo')) ||
    ['egreso', 'retiro', 'gasto_entre_sesiones'].includes(m.tipo)
  );

  let saldo = 0;

  if (!movimientos.length) {
    filas.innerHTML = '<tr><td colspan="5">Todavía no hay movimientos.</td></tr>';
    total.textContent = `Saldo actual: ${moneda} 0,00`;
    return;
  }

  const filasHTML = movimientos.map(m => {
    const ingreso = ['saldo_inicial', 'cobro'].includes(m.tipo) ? Number(m.importe) : 0;
    const egreso = ['egreso', 'retiro', 'gasto_entre_sesiones'].includes(m.tipo) ? Number(m.importe) : 0;

    saldo += ingreso - egreso;

    let movimiento = m.descripcion || m.tipo;

    if (m.tipo === 'saldo_inicial') movimiento = 'Saldo inicial';
    if (m.tipo === 'cobro') movimiento = 'Cobro en efectivo';
    if (m.tipo === 'egreso') movimiento = 'Egreso de Caja';
    if (m.tipo === 'retiro') movimiento = 'Retiro de Caja';
    if (m.tipo === 'gasto_entre_sesiones') movimiento = 'Gasto entre sesiones';

    if (m.observaciones) movimiento += ` - ${m.observaciones}`;

    const fecha = new Date(m.fecha).toLocaleString('es-AR');

    return `
      <tr>
        <td>${esc(fecha)}</td>
        <td>${esc(movimiento)}</td>
        <td>${ingreso ? ingreso.toLocaleString('es-AR', { minimumFractionDigits: 2 }) : '—'}</td>
        <td>${egreso ? egreso.toLocaleString('es-AR', { minimumFractionDigits: 2 }) : '—'}</td>
        <td>${saldo.toLocaleString('es-AR', { minimumFractionDigits: 2 })}</td>
      </tr>
    `;
  }).join('');
    filas.innerHTML = movimientos.length
    ? filasHTML.split('</tr>').filter(Boolean).reverse().map(fila => fila + '</tr>').join('')
    : '';

  total.textContent = `Saldo actual: ${moneda} ${saldo.toLocaleString('es-AR', { minimumFractionDigits: 2 })}`;
}

  if (!sesionId) {
    resultado.innerHTML = '<div class="msg err">Seleccioná una sesión cerrada.</div>';
    return;
  }

  resultado.innerHTML = '<p class="vacio">Generando informe…</p>';

  const { data, error } = await sb.rpc('informe_cierre_caja', {
    p_sesion_id: sesionId
  });

  if (error) {
    resultado.innerHTML =
      `<div class="msg err">No se pudo generar el informe: ${esc(error.message)}</div>`;
    return;

  if (!data || !data.sesion) {
    resultado.innerHTML = '<div class="msg err">No se recibieron datos del informe.</div>';
    return;

  const s = data.sesion;
  const movimientos = Array.isArray(data.movimientos) ? data.movimientos : [];
  const formatoImporte = n => Number(n || 0).toLocaleString('es-AR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  
  // Cheques y e-cheqs de esta sesión
  const valores = Array.isArray(data.valores) ? data.valores : [];

  const valoresRecibidos = valores.filter(v =>
    ['cheque', 'echeq', 'e-cheq'].includes(
      String(v.medio_pago || '').toLowerCase()
    )
  );

  const cheques = valoresRecibidos.filter(v =>
    String(v.medio_pago).toLowerCase() === 'cheque'

  const echeqs = valoresRecibidos.filter(v =>
    ['echeq', 'e-cheq'].includes(
      String(v.medio_pago).toLowerCase()

  const totalCheques = cheques.reduce(
    (total, v) => total + Number(v.importe || 0), 0

  const totalEcheqs = echeqs.reduce(

  const formatoFechaPago = fecha => fecha
    ? new Date(`${fecha}T00:00:00`).toLocaleDateString('es-AR')

  const sumarMovimientos = (tipo, moneda) =>
    movimientos

  const totalCobrosARS = sumarMovimientos('cobro', 'ARS');
  const totalCobrosUSD = sumarMovimientos('cobro', 'USD');

        editor.querySelector('#kit-guardar').onclick = async () => {
          const valores = [...rows.querySelectorAll('.kit-row')].map((row, index) => ({
  componente_producto_id: Number(row.querySelector('.kit-producto').value),
  cantidad: Number(row.querySelector('.kit-cantidad').value),
  orden: index + 1
}));

          if (
            !valores.length ||
            valores.some(v =>
              !v.componente_producto_id ||
              !Number.isInteger(v.cantidad) ||
              v.cantidad <= 0
            )
          ) {
            alert('Elegí un producto y una cantidad entera positiva en cada fila.');
            return;
          }

          const ids = valores.map(v => v.componente_producto_id);

          if (new Set(ids).size !== ids.length) {
            alert('No repitas el mismo producto. Sumá las cantidades en una sola fila.');
            return;
          }

          const botonGuardar = editor.querySelector('#kit-guardar');
          botonGuardar.disabled = true;

          try {
            const composicion = valores.map(v => ({
  kit_producto_id: kitId,
  componente_producto_id: v.componente_producto_id,
  cantidad: v.cantidad,
  orden: v.orden
}));

            const { error: errorGuardar } = await sb
              .from('producto_componentes')
              .upsert(composicion, {
                onConflict: 'kit_producto_id,componente_producto_id'
              });

            if (errorGuardar) {
              alert('No se pudo guardar la composición: ' + errorGuardar.message);
              return;
            }

            const conservar = new Set(ids.map(String));

            for (const antiguo of actuales) {
              if (conservar.has(String(antiguo.componente_producto_id))) {
                continue;
              }

              const { error: errorBorrar } = await sb
                .from('producto_componentes')
                .delete()
                .eq('kit_producto_id', kitId)
                .eq('componente_producto_id', antiguo.componente_producto_id);

              if (errorBorrar) {
                alert('La composición se guardó, pero no se pudo quitar un componente anterior: ' + errorBorrar.message);
                return;
              }
            }

            alert('Composición del kit guardada correctamente.');
            await listarProductos(true);

          } finally {
            botonGuardar.disabled = false;
          }
        };
      });

      modal.querySelector('#imp-confirmar').onclick = async () => {
        const incluirPrecios = [
          ...modal.querySelectorAll('.imp-tipo-copia')
        ].map(x => puedePrecios && x.value === 'con');

        // Abrir la ventana durante el clic del usuario para evitar
        // que el navegador bloquee la impresión.
        const ventana = window.open('', '_blank');

        if (!ventana) {
          alert('El navegador bloqueó la ventana de impresión. Permití las ventanas emergentes para esta aplicación.');
          return;
        }

        const boton = modal.querySelector('#imp-confirmar');
        boton.disabled = true;

        try {
          await imprimirCopiasPedido(p, incluirPrecios, ventana);
          modal.remove();
        } catch (error) {
          ventana.close();
          alert('No se pudo preparar la impresión: ' + error.message);
          boton.disabled = false;
        }
      };
    }

    async function imprimirCopiasPedido(p, incluirPrecios, ventana) {
      const items = (p.pedido_items || [])
        .filter(i => !i.padre_item_id)
        .sort((a, b) => a.id - b.id);

      const necesitaPrecios = incluirPrecios.some(Boolean);
      const precios = new Map();

      if (necesitaPrecios) {
        if (!['ventas', 'admin', 'supervisor'].includes(perfil.rol)) {
          throw new Error('Tu rol no tiene permiso para imprimir precios.');
        }

        const ids = items.map(i => i.id);

        if (ids.length) {
          const { data, error } = await sb
            .from('pedido_item_precios')
            .select('pedido_item_id,precio_unitario,descuento_tipo,descuento_valor,descuento_importe,total_linea')
            .in('pedido_item_id', ids);

          if (error) {
            throw new Error('No se pudieron consultar los precios: ' + error.message);
          }

          (data || []).forEach(x => {
            precios.set(String(x.pedido_item_id), x);
          });
        }

        const faltantes = items.filter(i => !precios.has(String(i.id)));

        if (faltantes.length && !confirm(
          'Hay productos sin precio histórico guardado. En la copia con precios aparecerán como "Sin precio registrado". ¿Continuar?'
        )) {
          return;
        }
      }

      const dinero = valor => Number(valor).toLocaleString('es-AR', {
        style: 'currency',
        currency: 'ARS'
      });

      const filas = (conPrecios) => items.map(i => {
        const serie = i.series?.length
          ? `<small>N.º de serie: ${i.series.map(s => esc(s.numero_serie)).join(', ')}</small>`
          : '';

        const base = `
      <td>${esc(i.producto)}${serie}</td>
      <td class="numero">${esc(i.cantidad)}</td>
    `;

        if (!conPrecios) {
          return `<tr>${base}</tr>`;
        }

        const precio = precios.get(String(i.id));

        if (!precio) {
          return `<tr>${base}<td colspan="3">Sin precio registrado</td></tr>`;
        }

        const descuento = Number(precio.descuento_importe || 0);
        const etiquetaDescuento =
          precio.descuento_tipo === 'porcentaje'
            ? `${precio.descuento_valor}%`
            : precio.descuento_tipo === 'importe'
              ? dinero(descuento)
              : '—';

        return `
      <tr>
        ${base}
        <td class="numero">${dinero(precio.precio_unitario)}</td>
        <td class="numero">${esc(etiquetaDescuento)}</td>
        <td class="numero">${dinero(precio.total_linea)}</td>
      </tr>
    `;
      }).join('');

      const logo = new URL('logo.png', document.baseURI).href;

      const documentos = incluirPrecios.map((conPrecios, indice) => {
        const hayPreciosFaltantes = conPrecios &&
          items.some(i => !precios.has(String(i.id)));

        const total = conPrecios && !hayPreciosFaltantes
          ? items.reduce((suma, i) =>
            suma + Number(precios.get(String(i.id)).total_linea), 0)
          : null;

        return `
      <section class="copia">
        <header>
         
          <div>
            <h1>Presupuesto ${esc(fmtRemito(p.numero_remito))}</h1>
            <p>Copia ${indice + 1} de ${incluirPrecios.length}</p>
          </div>
        </header>

        <p><b>Cliente:</b> ${esc(p.cliente)}</p>
        <p><b>Estado:</b> ${esc(ESTADOS[p.estado] || p.estado)}</p>
        <p><b>Modalidad:</b> ${esc(MODAL[p.modalidad] || p.modalidad)}</p>
        <p><b>Fecha de entrega:</b> ${esc(fmtFecha(p.fecha_entrega))}</p>

        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th class="numero">Cantidad</th>
              ${conPrecios ? `
                <th class="numero">Precio unitario</th>
                <th class="numero">Descuento</th>
                <th class="numero">Total</th>
              ` : ''}
            </tr>
          </thead>
          <tbody>${filas(conPrecios)}</tbody>
        </table>

        ${conPrecios ? `
          <h2 class="total">
            Total del presupuesto:
            ${total === null ? 'No disponible: faltan precios' : dinero(total)}
          </h2>
        ` : ''}

       ${p.comentarios
            ? `<p><b>Comentarios:</b> ${esc(p.comentarios)}</p>`
            : ''}
${p.nota_deposito
            ? `<p><b>Nota de depósito:</b> ${esc(p.nota_deposito)}</p>`
            : ''}
      </section>
    `;
      }).join('');

      ventana.document.open();
      ventana.document.write(`
    <!doctype html>
    <html lang="es">
    <head>
      <meta charset="utf-8">
      <title>Presupuesto ${esc(fmtRemito(p.numero_remito))}</title>
      <style>
        body { font-family: Arial, sans-serif; color: #172033; margin: 28px; }
        header { display:flex; justify-content:space-between; align-items:center; gap:20px; border-bottom:2px solid #1565B8; padding-bottom:14px; }
        header img { max-width:90px; max-height:70px; object-fit:contain; }
        h1 { font-size:22px; margin:0; }
        header p { margin:6px 0 0; color:#555; }
        table { width:100%; border-collapse:collapse; margin-top:24px; }
        th, td { border-bottom:1px solid #ddd; padding:10px 8px; text-align:left; vertical-align:top; }
        th { background:#f2f5f9; }
        .numero { text-align:right; white-space:nowrap; }
        small { display:block; margin-top:5px; color:#555; }
        .total { text-align:right; margin-top:24px; font-size:18px; }
        .copia:not(:last-child) { page-break-after:always; break-after:page; }
        @media print { body { margin:12mm; } }
      </style>
    </head>
    <body>${documentos}</\u0062ody>
    </html>
  `);
      ventana.document.close();
      ventana.focus();

      setTimeout(() => {
        ventana.focus();
        ventana.print();
      }, 400);
    }



    /* ---------- COMPLETAR PRECIOS PENDIENTES ---------- */
    async function completarPreciosPedido(pedidoId, volver) {
      if (!['ventas', 'admin', 'supervisor'].includes(perfil.rol)) {
        alert('No tenés permiso para completar precios.');
        return;
      }

      const { data: pedido, error: errorPedido } = await sb
        .from('pedidos')
        .select('id,cliente_id,lista_precio_id,precios_pendientes,estado')
        .eq('id', pedidoId)
        .single();

      if (errorPedido || !pedido) {
        alert('No se pudo cargar el pedido.');
        return;
      }

      if (!pedido.precios_pendientes) {
        alert('Este pedido no tiene precios pendientes.');
        await detallePedido(pedidoId, volver);
        return;
      }

      const estado = String(pedido.estado || '').toLowerCase();

      if (estado === 'anulado') {
        alert('No se pueden completar precios desde un pedido anulado.');
        return;
      }

      if (!pedido.lista_precio_id) {
        alert('El pedido no tiene una lista de precios principal asignada.');
        return;
      }

      const { data: items, error: errorItems } = await sb
        .from('pedido_items')
        .select('id,producto,cantidad')
        .eq('pedido_id', pedidoId)
        .is('padre_item_id', null);

      if (errorItems || !items || !items.length) {
        alert('No se pudieron cargar los productos del pedido.');
        return;
      }

      const itemIds = items.map(i => i.id);

      const { data: preciosPedido, error: errorPreciosPedido } = await sb
        .from('pedido_item_precios')
        .select('pedido_item_id,precio_unitario,total_linea,precio_cero_motivo')
        .in('pedido_item_id', itemIds);

      if (errorPreciosPedido) {
        alert('No se pudieron consultar los precios del pedido: ' + errorPreciosPedido.message);
        return;
      }

      const preciosRegistrados = new Map(
        (preciosPedido || []).map(r => [Number(r.pedido_item_id), r])
      );

      const preciosExistentes = new Set();

      for (const item of items) {
        const registro = preciosRegistrados.get(Number(item.id));
        if (!registro) continue;

        const precioRegistrado = Number(registro.precio_unitario);
        const totalRegistrado = Number(registro.total_linea);

        const precioValido =
          Number.isFinite(precioRegistrado) &&
          precioRegistrado >= 0 &&
          registro.total_linea !== null &&
          registro.total_linea !== undefined &&
          Number.isFinite(totalRegistrado) &&
          totalRegistrado >= 0 &&
          (
            precioRegistrado !== 0 ||
            Boolean(registro.precio_cero_motivo)
          );

        if (!precioValido) {
          alert(
            `El producto "${item.producto}" ya tiene un precio registrado, ` +
            'pero es inválido o le falta el motivo obligatorio para un precio cero. ' +
            'No se modificó ese registro. Revisalo antes de continuar.'
          );
          return;
        }

        preciosExistentes.add(Number(item.id));
      }

      const { data: catalogo, error: errorCatalogo } = await sb
        .from('productos')
        .select('id,nombre');

      if (errorCatalogo || !catalogo) {
        alert('No se pudo consultar el catálogo de productos.');
        return;
      }

      let listaIds = [Number(pedido.lista_precio_id)];

      if (pedido.cliente_id) {
        const { data: asignaciones, error: errorAsignaciones } = await sb
          .from('clientes_listas_precios')
          .select('lista_precios_id')
          .eq('cliente_id', pedido.cliente_id);

        if (errorAsignaciones) {
          alert('No se pudieron consultar las listas del cliente: ' + errorAsignaciones.message);
          return;
        }

        listaIds = [...new Set([
          ...listaIds,
          ...(asignaciones || []).map(x => Number(x.lista_precios_id))
        ].filter(id => Number.isInteger(id) && id > 0))];
      }

      const { data: listas, error: errorListas } = await sb
        .from('listas_precios')
        .select('id,nombre')
        .in('id', listaIds)
        .eq('activo', true);

      if (errorListas) {
        alert('No se pudieron consultar los nombres de las listas: ' + errorListas.message);
        return;
      }

      const nombreLista = new Map(
        (listas || []).map(l => [Number(l.id), l.nombre])
      );

      const { data: preciosListas, error: errorPreciosListas } = await sb
        .from('lista_precios_items')
        .select('lista_precio_id,producto_id,precio')
        .in('lista_precio_id', listaIds);

      if (errorPreciosListas) {
        alert('No se pudieron consultar los precios de las listas: ' + errorPreciosListas.message);
        return;
      }

      let especiales = [];

      if (pedido.cliente_id) {
        const { data, error } = await sb
          .from('precios_especiales_clientes')
          .select('producto_id,precio')
          .eq('cliente_id', pedido.cliente_id)
          .eq('activo', true);

        if (error) {
          alert('No se pudieron consultar los precios especiales: ' + error.message);
          return;
        }

        especiales = data || [];
      }

      // Solicita una decisión explícita cuando el precio elegido es cero.
      async function confirmarPrecioCero(item, elegido) {
        const confirmacion = confirm(
          `ATENCIÓN: "${item.producto}" tiene un precio de $0.\n\n` +
          `Origen: ${elegido.lista || elegido.origen_precio}\n\n` +
          '¿Confirmás que este producto se entregará sin cargo?\n\n' +
          'Aceptar: elegir el motivo del precio cero.\n' +
          'Cancelar: ingresar otro precio o cancelar la operación.'
        );

        if (!confirmacion) {
          const cambiar = confirm(
            '¿Querés ingresar otro precio excepcional para este pedido?\n\n' +
            'Aceptar: ingresar otro precio.\n' +
            'Cancelar: dejar este producto pendiente.'
          );

          if (!cambiar) return null;

          const entrada = prompt(
            `Ingresá el nuevo precio para "${item.producto}".\n` +
            'Este cambio será solo para este pedido y no modificará las listas.'
          );

          if (entrada === null || !entrada.trim()) return null;

          const precioAlternativo = Number(entrada.trim().replace(',', '.'));

          if (!Number.isFinite(precioAlternativo) || precioAlternativo <= 0) {
            alert('El precio alternativo debe ser mayor que cero. No se guardó el precio.');
            return null;
          }

          return {
            ...elegido,
            precio: precioAlternativo,
            origen_precio: 'excepcional_pedido',
            precio_cero_motivo: null,
            lista: 'Precio excepcional para este pedido'
          };
        }

        const opcionesMotivo = [
          '1. Bonificación',
          '2. Muestra sin cargo',
          '3. Promoción',
          '4. Otro'
        ].join('\n');

        const respuestaMotivo = prompt(
          `Elegí el motivo del precio cero para "${item.producto}":\n\n` +
          opcionesMotivo +
          '\n\nIngresá 1, 2, 3 o 4.'
        );

        if (respuestaMotivo === null) return null;

        const motivos = {
          '1': 'bonificacion',
          '2': 'muestra_sin_cargo',
          '3': 'promocion',
          '4': 'otro'
        };

        const motivo = motivos[respuestaMotivo.trim()];

        if (!motivo) {
          alert('El motivo ingresado no es válido. No se guardó el precio.');
          return null;
        }

        let motivoGuardado = motivo;

        if (motivo === 'otro') {
          const detalleMotivo = prompt(
            'Motivo: Otro.\n' +
            'Si querés, escribí una aclaración. Podés dejarla vacía.'
          );

          if (detalleMotivo === null) {
            // Cancelar la aclaración no cancela la selección del motivo.
            motivoGuardado = 'otro';
          } else if (detalleMotivo.trim()) {
            motivoGuardado = 'otro: ' + detalleMotivo.trim();
          }
        }

        return {
          ...elegido,
          precio: 0,
          precio_cero_motivo: motivoGuardado
        };
      }

      for (const item of items) {
        if (preciosExistentes.has(Number(item.id))) continue;

        const producto = catalogo.find(
          pr => String(pr.nombre).trim() === String(item.producto).trim()
        );

        if (!producto) {
          alert(`No se encontró "${item.producto}" en el catálogo. El pedido seguirá pendiente.`);
          return;
        }

        // El precio especial permanente tiene prioridad, incluso si es cero.
        const especial = (especiales || []).find(
          p =>
            Number(p.producto_id) === Number(producto.id) &&
            Number.isFinite(Number(p.precio)) &&
            Number(p.precio) >= 0
        );

        let opciones = [];

        if (especial) {
          opciones = [{
            lista_precio_id: Number(pedido.lista_precio_id),
            precio: Number(especial.precio),
            origen_precio: 'especial_permanente',
            lista: 'Precio especial permanente'
          }];
        } else {
          opciones = (preciosListas || [])
            .filter(p =>
              Number(p.producto_id) === Number(producto.id) &&
              Number.isFinite(Number(p.precio)) &&
              Number(p.precio) >= 0
            )
            .map(p => ({
              lista_precio_id: Number(p.lista_precio_id),
              precio: Number(p.precio),
              origen_precio: 'lista',
              lista: nombreLista.get(Number(p.lista_precio_id)) || 'Lista'
            }));
        }
        // Avisar siempre que exista una opción de precio cero,
        // aunque también haya precios positivos disponibles.
        const hayPrecioCero = opciones.some(
          opcion => Number(opcion.precio) === 0
        );

        if (hayPrecioCero) {
          const detalleCeros = opciones
            .filter(opcion => Number(opcion.precio) === 0)
            .map(opcion => opcion.lista || opcion.origen_precio)
            .filter((nombre, indice, lista) => lista.indexOf(nombre) === indice)
            .join(' / ');

          alert(
            `ATENCIÓN: "${item.producto}" tiene una opción de precio $0.\n\n` +
            `Origen: ${detalleCeros || 'Precio disponible'}\n\n` +
            'Revisá las opciones y elegí el precio que corresponda. ' +
            'Si seleccionás $0, deberás confirmar el motivo.'
          );
        }
        // Agrupa importes iguales sin ocultar opciones de precio cero.
        const grupos = new Map();

        for (const opcion of opciones) {
          const precioOpcion = Number(opcion.precio);
          const clave = String(precioOpcion);

          if (!grupos.has(clave)) {
            grupos.set(clave, {
              ...opcion,
              listas: [opcion.lista]
            });
          } else {
            const grupo = grupos.get(clave);
            if (!grupo.listas.includes(opcion.lista)) {
              grupo.listas.push(opcion.lista);
            }
          }
        }

        const opcionesAgrupadas = [...grupos.values()];
        let elegido;

        if (opcionesAgrupadas.length === 1) {
          elegido = opcionesAgrupadas[0];
        } else if (opcionesAgrupadas.length > 1) {
          const detalle = opcionesAgrupadas
            .map((o, i) =>
              `${i + 1}. ${o.listas.join(' / ')}: $${Number(o.precio)}`
            )
            .join('\n');

          const respuesta = prompt(
            `El producto "${item.producto}" tiene distintas opciones de precio:\n\n` +
            `${detalle}\n\n` +
            'Ingresá el número de la opción que querés usar.'
          );

          if (respuesta === null) {
            alert('Operación cancelada. El pedido seguirá pendiente.');
            return;
          }

          const indice = Number(respuesta) - 1;

          if (!Number.isInteger(indice) || !opcionesAgrupadas[indice]) {
            alert('La opción ingresada no es válida. El pedido seguirá pendiente.');
            return;
          }

          elegido = opcionesAgrupadas[indice];
        } else {
          const entrada = prompt(
            `El producto "${item.producto}" no tiene precio en las listas asignadas.\n` +
            'Ingresá un precio excepcional para este pedido. No modificará las listas.'
          );

          if (entrada === null || !entrada.trim()) {
            alert('No se completaron todos los precios. El pedido sigue pendiente.');
            return;
          }

          const precioExcepcional = Number(entrada.trim().replace(',', '.'));

          if (!Number.isFinite(precioExcepcional) || precioExcepcional < 0) {
            alert('El precio debe ser un número mayor o igual que cero. El pedido sigue pendiente.');
            return;
          }

          const listaPrecioId = Number(pedido.lista_precio_id);

          if (!Number.isInteger(listaPrecioId) || listaPrecioId <= 0) {
            alert('El pedido no tiene una lista de precios válida. No se guardó el precio.');
            return;
          }

          elegido = {
            lista_precio_id: listaPrecioId,
            precio: precioExcepcional,
            origen_precio: 'excepcional_pedido',
            lista: 'Precio excepcional para este pedido'
          };
        }

        // Si el precio seleccionado es cero, siempre exige confirmación y motivo.
        if (Number(elegido.precio) === 0) {
          elegido = await confirmarPrecioCero(item, elegido);

          if (!elegido) {
            alert(
              `No se guardó el precio de "${item.producto}". ` +
              'El pedido seguirá pendiente.'
            );
            return;
          }
        }

        const precio = Number(elegido.precio);
        const cantidad = Number(item.cantidad);
        const subtotal = precio * cantidad;

        if (
          !Number.isFinite(precio) ||
          precio < 0 ||
          !Number.isFinite(cantidad) ||
          cantidad <= 0 ||
          !Number.isFinite(subtotal) ||
          subtotal < 0
        ) {
          alert(
            `El precio, la cantidad o el subtotal de "${item.producto}" no son válidos. ` +
            'No se guardó ese precio y el pedido seguirá pendiente.'
          );
          return;
        }

        if (precio === 0 && !elegido.precio_cero_motivo) {
          alert('Para guardar un precio cero es obligatorio seleccionar un motivo.');
          return;
        }

        const { error: errorGuardarPedido } = await sb
          .from('pedido_item_precios')
          .insert({
            pedido_item_id: item.id,
            lista_precio_id: elegido.lista_precio_id,
            precio_unitario: precio,
            descuento_tipo: 'ninguno',
            descuento_valor: 0,
            descuento_importe: 0,
            total_linea: subtotal,
            origen_precio: elegido.origen_precio,
            precio_cero_motivo: precio === 0 ? elegido.precio_cero_motivo : null,
            creado_por: perfil.id
          });

        if (errorGuardarPedido) {
          alert(
            'No se pudo guardar el precio en el pedido: ' +
            errorGuardarPedido.message +
            '. El pedido seguirá pendiente.'
          );
          return;
        }

        preciosExistentes.add(Number(item.id));
      }

      if (preciosExistentes.size !== items.length) {
        alert('Todavía quedan productos sin precio. El pedido seguirá pendiente.');
        return;
      }

      const { data: resultadoFinalizacion, error: errorActualizarPedido } =
        await sb.rpc('finalizar_precios_pedido', {
          p_pedido_id: pedidoId
        });

      if (errorActualizarPedido) {
        alert(
          'Los precios están registrados, pero no se pudo finalizar el pedido: ' +
          errorActualizarPedido.message +
          '. El pedido seguirá pendiente.'
        );
        return;
      }

      if (
        resultadoFinalizacion !== 'precios_completados' &&
        resultadoFinalizacion !== 'ya_completado'
      ) {
        alert(
          'No se pudo confirmar el cierre de precios. Resultado: ' +
          resultadoFinalizacion
        );
        return;
      }

      if (estado === 'entregado') {
        alert('Los precios se completaron correctamente. El pedido sigue entregado.');
      } else {
        alert('Los precios se completaron correctamente. El pedido ya puede continuar su proceso.');
      }

      await detallePedido(pedidoId, volver);
    }


    async function detallePedido(id, volver) {
      const c = document.getElementById('contenido');

      c.innerHTML = '<div class="panel vacio">Cargando…</div>';
      const { data: p, error } = await sb.from('pedidos').select('*, pedido_items(*, series(*))').eq('id', id).single();

      if (error) return c.innerHTML = `<div class="panel"><div class="msg err">${esc(error.message)}</div></div>`;
      const puedeAnular = ['ventas', 'admin'].includes(perfil.rol) && ['pendiente', 'listo'].includes(p.estado);
      const puedeEditarNota = ['deposito', 'admin', 'supervisor'].includes(perfil.rol) && p.estado === 'listo';
      const itemsOrdenados = [...p.pedido_items].sort((a, b) => a.id - b.id);

const filas = itemsOrdenados
  .filter(i => !i.padre_item_id)
  .map(i => {
    const componentes = itemsOrdenados.filter(
      comp => Number(comp.padre_item_id) === Number(i.id)
    );

    return `
      <tr>
        <td>
          <b style="font-weight:700">${esc(i.producto)}</b>
          ${i.series?.length ? `<small class="series">N.º de serie: ${i.series.map(s => esc(s.numero_serie)).join(', ')}</small>` : ''}
        </td>
        <td class="num">${i.cantidad}</td>
      </tr>
      ${componentes.map(comp => `
        <tr>
          <td style="padding:5px 12px 5px 32px;border-left:3px solid #cbd5e1;background:#fafbfd;color:#64748b;font-size:12px">
            <small style="display:block;color:#94a3b8;font-size:10px">↳ COMPONENTE DEL KIT</small>
            ${esc(comp.producto)}
          </td>
          <td class="num" style="color:#64748b;font-size:12px">${comp.cantidad}</td>
        </tr>
      `).join('')}
    `;
  }).join('');
      c.innerHTML = `<div class="panel remito">
    <div class="no-print acciones sup"><button class="btn sec chico" id="volver">← Volver</button>
      <button class="btn chico" id="imprimir">Imprimir / guardar PDF</button>
      ${p.precios_pendientes &&
          ['ventas', 'admin', 'supervisor'].includes(perfil.rol) &&
          !['entregado', 'anulado'].includes(
            String(p.estado || '').toLowerCase()
          )
          ? '<button class="btn chico" id="completar-precios">Completar precios</button>'
          : ''}
      ${puedeEditarNota ? '<button class="btn chico" id="editar-nota-deposito">Editar observaciones</button>' : ''}
      ${puedeAnular ? '<button class="btn chico peligro" id="anular">Anular pedido</button>' : ''}</div>
          ${p.precios_pendientes
          ? '<div class="no-print msg err" style="margin:12px 0"><strong>Precios pendientes.</strong> Completá los precios antes de marcar este pedido como Entregado.</div>'
          : ''}
    <div class="enc">
  <div class="num-remito">
    Presupuesto
    <b>${fmtRemito(p.numero_remito)}</b>
  </div>
</div>
    <p><b>Cliente:</b> ${esc(p.cliente)}<br>
       <b>Estado:</b> <span class="etiqueta ${p.estado}">${ESTADOS[p.estado]}</span><br>
       <b>Entrega:</b> ${MODAL[p.modalidad]}<br>
       <b>Fecha de entrega:</b> ${fmtFecha(p.fecha_entrega)}<br>
       <b>Creado:</b> ${fmtFechaHora(p.creado_en)}${p.fecha_listo ? `<br><b>Listo:</b> ${fmtFechaHora(p.fecha_listo)}` : ''}
       ${p.fecha_entregado ? `<br><b>Entregado:</b> ${fmtFechaHora(p.fecha_entregado)}` : ''}</p>
    <table><thead><tr><th>Producto</th><th class="num">Cantidad</th></tr></thead><tbody>${filas}</tbody></table>
    ${p.comentarios ? `<p><b>Comentarios:</b> ${esc(p.comentarios)}</p>` : ''}
${p.nota_deposito ? `<p><b>Observaciones de entrega:</b> ${esc(p.nota_deposito)}</p>` : ''}
${p.enargas_transferido !== null ? `<p><b>Series transferidas en ENARGAS:</b> ${p.enargas_transferido ? 'Sí' : 'No'}</p>` : ''}
  </div>`;
      document.getElementById('volver').onclick = volver;
      document.getElementById('imprimir').onclick = () =>
        opcionesImpresionPedido(p);
      const btnCompletarPrecios =
        document.getElementById('completar-precios');

      if (btnCompletarPrecios) {
        btnCompletarPrecios.onclick = () =>
          completarPreciosPedido(id, volver);
      }
      const btnEditarNota = document.getElementById('editar-nota-deposito');

      if (btnEditarNota) {
        btnEditarNota.onclick = async () => {
          const nota = prompt(
            'Observaciones de entrega (por ejemplo: 3 bultos):',
            p.nota_deposito || ''
          );

          // Si se pulsa Cancelar, no se modifica nada.
          if (nota === null) return;

          const { error } = await sb
            .from('pedidos')
            .update({
              nota_deposito: nota.trim() || null
            })
            .eq('id', p.id);

          if (error) {
            alert('No se pudieron guardar las observaciones: ' + error.message);
            return;
          }

          alert('Observaciones guardadas correctamente.');
          await detallePedido(p.id, volver);
        };
      }
     const a = document.getElementById('anular');
if (a) a.onclick = async () => {
  if (!confirm(`¿Anular el presupuesto ${fmtRemito(p.numero_remito)}? No se puede deshacer. Las series cargadas quedarán disponibles para otros pedidos.`)) return;

  a.disabled = true;

  const { data, error } = await sb.rpc('anular_pedido_y_liberar_series', {
    p_pedido_id: p.id
  });

  if (error) {
    alert('No se pudo anular el pedido: ' + error.message);
    a.disabled = false;
    return;
  }

  alert(`Pedido anulado correctamente. Se liberaron ${data} número(s) de serie.`);
  detallePedido(p.id, volver);
};
    }

    /* ---------- ADMIN: USUARIOS (funcional) ---------- */
    async function vistaUsuarios() {
      if (perfil?.rol !== 'admin') {
        return alert('No tenés permiso para administrar usuarios.');
      }
      const cont = document.getElementById('contenido');
      cont.innerHTML = `<div class="panel"><h2>Usuarios</h2><div id="lista" class="vacio">Cargando…</div></div>`;
      const { data, error } = await sb.from('profiles').select('*').order('creado_en', { ascending: false });
      const lista = document.getElementById('lista');
      if (error) return lista.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
      lista.className = '';
      lista.innerHTML = data.map(u => `
    <div class="fila">
      <div class="dato"><b>${esc(u.nombre)}</b>
        <small>${u.rol === 'pendiente' ? `<span class="etiqueta pendiente">Pidió: ${esc(ROLES[u.puesto_solicitado] || '—')}</span>` : ''}</small></div>
      <select data-id="${u.id}" data-campo="rol" aria-label="Puesto de ${esc(u.nombre)}" ${u.id === perfil.id ? 'disabled' : ''}>
        ${Object.entries(ROLES).map(([k, n]) => `<option value="${k}" ${u.rol === k ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
      <select data-id="${u.id}" data-campo="activo" aria-label="Estado de ${esc(u.nombre)}" ${u.id === perfil.id ? 'disabled' : ''}>
        <option value="true" ${u.activo ? 'selected' : ''}>Activo</option>
        <option value="false" ${!u.activo ? 'selected' : ''}>Desactivado</option>
      </select>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <input
          type="email"
          data-email-id="${u.id}"
          placeholder="Nuevo correo electrónico"
          aria-label="Nuevo correo de ${esc(u.nombre)}"
        >
        <button
          type="button"
          data-cambiar-email="${u.id}"
          ${u.id === perfil.id ? 'disabled' : ''}
        >
          Cambiar email
        </button>
      </div>
    </div>`).join('') || '<p class="vacio">Todavía no hay usuarios.</p>';
      lista.querySelectorAll('select').forEach(s => s.onchange = async () => {
        const id = s.dataset.id;
        const campo = s.dataset.campo;
        const valor = campo === 'activo' ? s.value === 'true' : s.value;

        const usuario = data.find(u => u.id === id);
        if (!usuario) return;

        let cambios = { [campo]: valor };

        // Al asignar un rol operativo a un usuario pendiente,
        // activar su cuenta automáticamente.
        if (
          campo === 'rol' &&
          usuario.rol === 'pendiente' &&
          ['ventas', 'deposito', 'supervisor', 'admin'].includes(valor)
        ) {
          cambios.activo = true;
        }

        const { error } = await sb
          .from('profiles')
          .update(cambios)
          .eq('id', id);

        if (error) {
          alert('No se pudo guardar: ' + error.message);
        }

        await vistaUsuarios();
      });
      lista.querySelectorAll('[data-cambiar-email]').forEach(b => {
        b.onclick = async () => {
          const userId = b.dataset.cambiarEmail;
          const input = lista.querySelector(
            `[data-email-id="${userId}"]`
          );
          const newEmail = input?.value.trim().toLowerCase();

          if (!newEmail) {
            alert('Escribí el nuevo correo electrónico.');
            return;
          }

          if (!confirm(
            'Vas a cambiar el correo a ' + newEmail +
            '. El cambio se aplicará sin pedir confirmación al correo nuevo. ¿Continuar?'
          )) {
            return;
          }

          b.disabled = true;

          try {
            const { data, error } = await sb.functions.invoke(
              'cambiar-email-usuario',
              {
                body: {
                  userId: userId,
                  newEmail: newEmail
                }
              }
            );

            if (error) {
              let mensaje = error.message;

              if (error.context &&
                typeof error.context.json === 'function') {
                try {
                  const detalle = await error.context.json();
                  if (detalle && detalle.error) {
                    mensaje = detalle.error;
                  }
                } catch (_) { }
              }

              alert('No se pudo cambiar el correo: ' + mensaje);
              return;
            }

            if (!data || data.ok !== true) {
              alert(
                data?.error ||
                'No se pudo confirmar el cambio del correo.'
              );
              return;
            }

            alert('Correo actualizado correctamente: ' + data.email);
            await vistaUsuarios();

          } catch (error) {
            alert(
              'Error al conectar con Supabase: ' + error.message
            );
          } finally {
            b.disabled = false;
          }
        };
      });
    }

    /* ---------- ARRANQUE ---------- */
    sb.auth.onAuthStateChange((evento, sesion) => {
      if (sesion) setTimeout(cargarPerfil, 0); else { perfil = null; pantallaLogin(); }
    });
    sb.auth.getSession().then(({ data: { session } }) => { if (!session) pantallaLogin(); });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
          console.log("SGV: service worker registrado");
        } catch (error) {
          console.error("SGV: error al registrar service worker", error);
        }
      });
    }
  </script>
</body>

</html>
